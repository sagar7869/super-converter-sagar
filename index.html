<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Super Converter Pro - HD Studio</title>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script async src="https://docs.opencv.org/4.9.0/opencv.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family:Segoe UI,Tahoma,Verdana,sans-serif;
}

html{
    width:100%;
    min-height:100%;
    background:#020617;
}

body{
    margin:0;
    width:100%;
    min-height:100dvh;
    padding:
        max(12px,env(safe-area-inset-top))
        12px
        calc(125px + env(safe-area-inset-bottom));
    background:#0f172a;
    color:#f8fafc;
    text-align:center;
    overflow-x:hidden;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =========================
HEADER
========================= */

h1{
    font-size:21px;
    line-height:1.2;
    margin:2px 0 3px;
}

.subtitle{
    color:#94a3b8;
    font-size:12px;
    margin:0 0 14px;
}

/* =========================
TOOLS
========================= */

.tool-grid{
    width:100%;
    max-width:600px;
    margin:0 auto 14px;

    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:7px;
}

.tool-card{
    min-height:48px;
    border:1px solid #334155;
    background:#1e293b;
    color:#94a3b8;
    border-radius:10px;
    padding:8px 4px;
    font-weight:700;
    font-size:12px;
}

.tool-card.active{
    background:#312e81;
    border-color:#6366f1;
    color:#c7d2fe;
}

/* =========================
PANEL
========================= */

.panel{
    width:100%;
    max-width:600px;
    margin:0 auto;
    padding:14px;
    border-radius:14px;
    background:#1e293b;
    border:1px solid #334155;
    box-shadow:0 10px 30px rgba(0,0,0,.28);
}

.hidden{
    display:none!important;
}

/* =========================
COMMON BUTTON
========================= */

.primary-btn{
    width:100%;
    min-height:48px;
    border:0;
    border-radius:10px;
    padding:12px 14px;
    background:#6366f1;
    color:#fff;
    font-size:14px;
    font-weight:800;
}

.primary-btn:active{
    transform:scale(.985);
}

.success-btn{
    background:#10b981;
}

.danger-btn{
    background:#ef4444;
}

/* =========================
DROP ZONE
========================= */

.drop-zone{
    width:100%;
    background:#0f172a;
    border:2px dashed #475569;
    border-radius:12px;
    padding:28px 14px;
    cursor:pointer;
    color:#cbd5e1;
    font-size:14px;
    font-weight:700;
}

.drop-zone:active{
    background:#172033;
}

/* =========================
QUEUE
========================= */

.file-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    padding:10px;
    background:#0f172a;
    border:1px solid #334155;
    border-radius:8px;
    margin-top:7px;

    font-size:11px;
    text-align:left;
}

.file-item span:first-child{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* =========================
OPTIONS
========================= */

.options-panel{
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:12px;
}

.options-panel label{
    color:#cbd5e1;
    font-size:11px;
    font-weight:800;
}

.options-panel input,
.options-panel select,
.pdf-options select{
    width:100%;
    min-height:42px;
    background:#0f172a;
    color:white;
    border:1px solid #475569;
    border-radius:8px;
    padding:8px 10px;
    outline:none;
}

/* =========================
SCAN START
========================= */

.camera-box{
    width:100%;
    background:#0f172a;
    border:2px dashed #6366f1;
    border-radius:12px;
    padding:28px 12px;
    cursor:pointer;
}

.camera-icon{
    font-size:34px;
    margin-bottom:7px;
}

.camera-title{
    color:#a5b4fc;
    font-weight:800;
    font-size:16px;
}

.camera-sub{
    color:#94a3b8;
    font-size:11px;
    margin-top:6px;
    line-height:1.5;
}

/* =========================
SCANNED PAGES
========================= */

.scan-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:18px 0 8px;
}

.scan-heading-title{
    font-size:13px;
    font-weight:800;
}

.page-count{
    color:#a5b4fc;
    font-size:11px;
    font-weight:700;
}

.scanned-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}

.grid-thumb{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    overflow:hidden;
    background:#020617;
    border:1px solid #334155;
    border-radius:10px;
}

.grid-thumb img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    cursor:pointer;
}

.delete-page{
    position:absolute;
    top:6px;
    right:6px;

    width:30px;
    height:30px;

    border:0;
    border-radius:50%;

    background:#ef4444;
    color:#fff;

    font-size:18px;
    font-weight:900;
    line-height:30px;
    padding:0;
}

.page-number{
    position:absolute;
    bottom:6px;
    left:6px;

    padding:4px 8px;
    background:rgba(0,0,0,.78);
    border-radius:20px;
    font-size:10px;
}

/* =========================
SAVE AREA
========================= */

.save-box{
    margin-top:14px;
    padding:12px;

    background:#0b1220;
    border:1px solid #475569;
    border-radius:12px;
}

.save-title{
    font-size:12px;
    font-weight:800;
    text-align:left;
    margin-bottom:9px;
}

.pdf-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-bottom:9px;
}

/*
IMPORTANT:
sticky save bar for mobile/browser
*/

#scan-save-bar{
    position:fixed;

    left:10px;
    right:10px;

    bottom:max(10px,env(safe-area-inset-bottom));

    z-index:500;

    max-width:580px;
    margin:0 auto;

    padding:9px;

    background:rgba(15,23,42,.96);
    border:1px solid #475569;
    border-radius:14px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.55);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.save-bar-top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:7px;

    font-size:11px;
}

.save-bar-pages{
    color:#cbd5e1;
    font-weight:700;
}

.save-bar-status{
    color:#a5b4fc;
    font-weight:800;
}

.save-bar-btn{
    width:100%;
    min-height:50px;

    border:0;
    border-radius:10px;

    background:#10b981;
    color:#fff;

    font-size:15px;
    font-weight:900;

    box-shadow:0 5px 18px rgba(16,185,129,.25);
}

/* =========================
EDITOR
========================= */

#review-workspace{
    position:fixed;
    inset:0;

    width:100vw;
    height:100dvh;

    background:#020617;

    z-index:1000;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    padding:
        max(7px,env(safe-area-inset-top))
        8px
        max(8px,env(safe-area-inset-bottom));
}

.review-header{
    width:100%;
    min-height:42px;

    display:grid;
    grid-template-columns:70px 1fr 70px;
    align-items:center;

    flex-shrink:0;
}

.editor-title{
    text-align:center;
    font-size:14px;
    font-weight:900;
}

.cancel-btn{
    border:0;
    background:#1e293b;
    color:#f87171;

    border-radius:8px;
    min-height:34px;

    font-size:11px;
    font-weight:800;
}

.editor-add{
    border:0;
    background:#1e293b;
    color:#a5b4fc;

    border-radius:8px;
    min-height:34px;

    font-size:11px;
    font-weight:800;
}

/* =========================
EDITOR AREA
========================= */

.editor-area{
    position:relative;

    width:100%;
    flex:1;
    min-height:0;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            #172033 0,
            #020617 72%
        );

    border-radius:12px;

    touch-action:none;
}

#editor-canvas{
    display:block;

    max-width:100%;
    max-height:100%;

    width:auto;
    height:auto;

    touch-action:none;

    user-select:none;
    -webkit-user-select:none;
}

.editor-message{
    position:absolute;

    top:8px;
    left:50%;

    transform:translateX(-50%);

    max-width:90%;

    background:rgba(15,23,42,.88);
    color:#cbd5e1;

    font-size:10px;

    padding:6px 10px;
    border-radius:20px;

    pointer-events:none;

    white-space:nowrap;
}

/* =========================
CONTROL SCROLL AREA
========================= */

.editor-controls{
    width:100%;
    flex-shrink:0;

    padding-top:7px;

    background:#020617;
}

/* =========================
MODE BAR
========================= */

.mode-bar{
    width:100%;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:6px;

    margin-bottom:6px;
}

.mode-btn{
    min-height:42px;

    background:#1e293b;
    color:#e2e8f0;

    border:1px solid #334155;
    border-radius:8px;

    font-size:11px;
    font-weight:800;
}

.mode-btn.active{
    background:#4f46e5;
    border-color:#818cf8;
}

/* =========================
FILTER BAR
========================= */

.filter-scroll{
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;

    scrollbar-width:none;

    margin-bottom:6px;
}

.filter-scroll::-webkit-scrollbar{
    display:none;
}

.filter-bar{
    display:flex;
    gap:6px;

    width:max-content;
    min-width:100%;
}

.filter-btn{
    flex:0 0 auto;

    min-width:75px;
    min-height:40px;

    border:1px solid #334155;
    background:#1e293b;
    color:#e2e8f0;

    padding:8px 10px;

    border-radius:8px;

    font-size:10px;
    font-weight:800;
}

.filter-btn.active{
    background:#4f46e5;
    border-color:#818cf8;
}

/* =========================
EDITOR BUTTONS
========================= */

.editor-buttons{
    width:100%;

    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));

    gap:6px;
}

.editor-buttons button{
    min-height:43px;

    border:1px solid #334155;
    border-radius:8px;

    padding:7px 3px;

    background:#1e293b;
    color:#fff;

    font-size:10px;
    font-weight:800;
}

.editor-buttons .keep{
    grid-column:1 / -1;

    background:#10b981;
    border-color:#10b981;

    min-height:48px;

    font-size:13px;
}

/* =========================
SMALL HEIGHT DEVICES
========================= */

@media(max-height:700px){

    #review-workspace{
        padding-top:4px;
    }

    .review-header{
        min-height:35px;
    }

    .editor-area{
        border-radius:8px;
    }

    .editor-message{
        display:none;
    }

    .mode-btn,
    .filter-btn,
    .editor-buttons button{
        min-height:36px;
        padding:5px 3px;
    }

    .editor-buttons .keep{
        min-height:40px;
    }
}

/* =========================
DESKTOP
========================= */

@media(min-width:700px){

    body{
        padding-left:20px;
        padding-right:20px;
    }

    .panel{
        padding:18px;
    }

    #review-workspace{
        padding:12px;
    }

    .review-header{
        max-width:1000px;
        width:100%;
        margin:auto;
    }

    .editor-area{
        max-width:1000px;
        width:100%;
        margin:0 auto;
    }

    .editor-controls{
        max-width:1000px;
        width:100%;
        margin:0 auto;
    }

}

/* =========================
VERY SMALL PHONES
========================= */

@media(max-width:360px){

    body{
        padding-left:8px;
        padding-right:8px;
    }

    .tool-card{
        font-size:10px;
    }

    .panel{
        padding:10px;
    }

    .editor-buttons button{
        font-size:9px;
    }

    .filter-btn{
        min-width:68px;
    }
}
</style>
</head>

<body>

<h1>Super Converter Pro</h1>
<p class="subtitle">HD Document Studio</p>

<div class="tool-grid">

    <button id="tab-merge"
            class="tool-card active"
            onclick="switchTab('merge')">
        📄 Merge PDF
    </button>

    <button id="tab-resize"
            class="tool-card"
            onclick="switchTab('resize')">
        🖼️ Image Resizer
    </button>

    <button id="tab-scan"
            class="tool-card"
            onclick="switchTab('scan')">
        📸 Smart Scan
    </button>

</div>


<!-- =====================================================
MERGE PDF
===================================================== -->

<div id="panel-merge" class="panel">

    <div class="drop-zone"
         onclick="document.getElementById('merge-input').click()">

        📂 Tap to Select PDF Files

        <input
            id="merge-input"
            type="file"
            accept="application/pdf"
            multiple
            hidden
            onchange="handleQueueFiles(this.files,'pdf')">

    </div>

    <div id="merge-queue"></div>

    <button
        id="merge-btn"
        class="primary-btn hidden"
        style="margin-top:12px"
        onclick="executeMerge()">

        Merge & Download PDF

    </button>

</div>


<!-- =====================================================
IMAGE RESIZER
===================================================== -->

<div id="panel-resize" class="panel hidden">

    <div class="options-panel">

        <label>Target Size</label>

        <div style="display:flex;gap:7px">

            <input
                id="resize-size"
                type="number"
                min="1"
                placeholder="e.g. 150">

            <select id="resize-unit">
                <option>KB</option>
                <option>MB</option>
            </select>

        </div>

        <label>Export Format</label>

        <select id="resize-format">

            <option value="image/jpeg">
                JPG
            </option>

            <option value="image/png">
                PNG
            </option>

        </select>

    </div>

    <div class="drop-zone"
         onclick="document.getElementById('resize-input').click()">

        🖼️ Tap to Select Images

        <input
            id="resize-input"
            type="file"
            accept="image/*"
            multiple
            hidden
            onchange="handleQueueFiles(this.files,'image')">

    </div>

    <div id="resize-queue"></div>

    <button
        id="resize-btn"
        class="primary-btn hidden"
        style="margin-top:12px"
        onclick="executeResize()">

        Compress & Download Images

    </button>

</div>


<!-- =====================================================
SMART SCAN
===================================================== -->

<div id="panel-scan" class="panel hidden">

    <div class="camera-box"
         onclick="document.getElementById('camera-input').click()">

        <div class="camera-icon">
            📸
        </div>

        <div class="camera-title">
            Scan Document
        </div>

        <div class="camera-sub">
            Open camera and capture your document in HD
        </div>

        <input
            id="camera-input"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
            onchange="handleScanFile(this.files[0])">

    </div>

    <button
        class="primary-btn"
        style="margin-top:8px"
        onclick="document.getElementById('gallery-input').click()">

        🖼️ Select From Gallery

    </button>

    <input
        id="gallery-input"
        type="file"
        accept="image/*"
        multiple
        hidden
        onchange="handleGallery(this.files)">


    <div class="scan-heading">

        <div class="scan-heading-title">
            Scanned Pages
        </div>

        <div id="page-count"
             class="page-count">
            0 Pages
        </div>

    </div>

    <div id="scanned-grid"
         class="scanned-grid">
    </div>


    <!-- Normal save box remains available on page -->

    <div id="save-box"
         class="save-box hidden">

        <div class="save-title">
            📄 PDF Settings
        </div>

        <div class="pdf-options">

            <select id="pdf-size">

                <option value="original">
                    Original Size
                </option>

                <option value="a4">
                    A4
                </option>

                <option value="letter">
                    Letter
                </option>

            </select>

            <select id="pdf-quality">

                <option value="0.98">
                    Maximum HD
                </option>

                <option value="0.92">
                    High Quality
                </option>

                <option value="0.82">
                    Balanced
                </option>

            </select>

        </div>

        <button
            class="primary-btn success-btn"
            onclick="saveScannedPDF()">

            💾 SAVE AS PDF

        </button>

    </div>

</div>


<!-- =====================================================
FIXED MOBILE SAVE BAR
===================================================== -->

<div id="scan-save-bar"
     class="hidden">

    <div class="save-bar-top">

        <span id="save-bar-pages"
              class="save-bar-pages">
            0 Pages
        </span>

        <span class="save-bar-status">
            PDF Ready
        </span>

    </div>

    <button
        id="save-pdf-btn"
        class="save-bar-btn"
        onclick="saveScannedPDF()">

        💾 SAVE AS PDF

    </button>

</div>


<!-- =====================================================
SMART SCAN EDITOR
===================================================== -->

<div id="review-workspace"
     class="hidden">

    <div class="review-header">

        <button
            class="cancel-btn"
            onclick="closeEditor()">

            ✕ Cancel

        </button>

        <div class="editor-title">
            ✨ Smart Scan
        </div>

        <button
            class="editor-add"
            onclick="keepPage()">

            ✓ Keep

        </button>

    </div>


    <div class="editor-area">

        <canvas id="editor-canvas"></canvas>

        <div class="editor-message">
            Drag corners or draw a crop area
        </div>

    </div>


    <div class="editor-controls">

        <!-- CROP MODE -->

        <div class="mode-bar">

            <button
                id="perspective-mode"
                class="mode-btn active"
                onclick="setCropMode('perspective')">

                🔷 4-Corner

            </button>

            <button
                id="free-mode"
                class="mode-btn"
                onclick="setCropMode('free')">

                ✂️ Free Crop

            </button>

        </div>


        <!-- FILTERS -->

        <div class="filter-scroll">

            <div class="filter-bar">

                <button
                    class="filter-btn active"
                    onclick="setFilter('original',this)">

                    Original

                </button>

                <button
                    class="filter-btn"
                    onclick="setFilter('auto',this)">

                    ✨ Auto

                </button>

                <button
                    class="filter-btn"
                    onclick="setFilter('bw',this)">

                    ⚫ B&W

                </button>

                <button
                    class="filter-btn"
                    onclick="setFilter('gray',this)">

                    ◻ Gray

                </button>

            </div>

        </div>


        <!-- EDIT BUTTONS -->

        <div class="editor-buttons">

            <button onclick="rotateImage()">
                🔄 Rotate
            </button>

            <button onclick="autoDetect()">
                🤖 Auto Detect
            </button>

            <button onclick="resetCrop()">
                ↩ Reset
            </button>

            <button
                class="keep"
                onclick="keepPage()">

                ✅ KEEP PAGE & SAVE

            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
GLOBAL
===================================================== */

let activeTab="merge";

let queue=[];

let scannedPages=[];

let sourceCanvas=null;

let editingIndex=-1;

let cropMode="perspective";

let filterMode="original";

let corners=[
    {x:.03,y:.03},
    {x:.97,y:.03},
    {x:.97,y:.97},
    {x:.03,y:.97}
];

let freeCrop={
    left:.03,
    top:.03,
    right:.97,
    bottom:.97
};

let dragCorner=-1;

let dragFree=false;

let drawingFree=false;

let dragStart=null;

let freeStart=null;

const canvas=
    document.getElementById("editor-canvas");


/* =====================================================
TAB
===================================================== */

function switchTab(tab){

    activeTab=tab;

    ["merge","resize","scan"].forEach(t=>{

        document
            .getElementById(`tab-${t}`)
            .classList.toggle(
                "active",
                t===tab
            );

        document
            .getElementById(`panel-${t}`)
            .classList.toggle(
                "hidden",
                t!==tab
            );

    });

    updateSaveUI();

}


/* =====================================================
QUEUE
===================================================== */

function handleQueueFiles(files,type){

    queue=Array.from(files);

    let html="";

    queue.forEach(file=>{

        html+=`
        <div class="file-item">
            <span>${escapeHTML(file.name)}</span>
            <span>${formatBytes(file.size)}</span>
        </div>`;

    });

    if(type==="pdf"){

        document.getElementById(
            "merge-queue"
        ).innerHTML=html;

        document.getElementById(
            "merge-btn"
        ).classList.toggle(
            "hidden",
            queue.length===0
        );

    }else{

        document.getElementById(
            "resize-queue"
        ).innerHTML=html;

        document.getElementById(
            "resize-btn"
        ).classList.toggle(
            "hidden",
            queue.length===0
        );

    }

}


/* =====================================================
MERGE
===================================================== */

async function executeMerge(){

    const btn=
        document.getElementById("merge-btn");

    if(!queue.length)return;

    btn.disabled=true;
    btn.innerText="Merging...";

    try{

        const pdfDoc=
            await PDFLib.PDFDocument.create();

        for(const file of queue){

            const bytes=
                await file.arrayBuffer();

            const src=
                await PDFLib.PDFDocument.load(bytes);

            const pages=
                await pdfDoc.copyPages(
                    src,
                    src.getPageIndices()
                );

            pages.forEach(
                p=>pdfDoc.addPage(p)
            );

        }

        const output=
            await pdfDoc.save();

        download(
            new Blob(
                [output],
                {type:"application/pdf"}
            ),
            "Merged_Document.pdf"
        );

        alert("PDF merged successfully!");

        queue=[];

        document.getElementById(
            "merge-queue"
        ).innerHTML="";

        btn.classList.add("hidden");

    }catch(error){

        alert(
            "Merge Error: "+
            error.message
        );

    }

    btn.disabled=false;
    btn.innerText="Merge & Download PDF";

}


/* =====================================================
RESIZER
===================================================== */

async function executeResize(){

    const btn=
        document.getElementById("resize-btn");

    const size=
        parseFloat(
            document.getElementById(
                "resize-size"
            ).value
        );

    if(!size || size<=0){

        alert("Please enter target size.");

        return;

    }

    const unit=
        document.getElementById(
            "resize-unit"
        ).value;

    const format=
        document.getElementById(
            "resize-format"
        ).value;

    const targetKB=
        unit==="MB"
        ?size*1024
        :size;

    btn.disabled=true;
    btn.innerText="Processing...";

    try{

        for(const file of queue){

            const img=
                await loadImageFromFile(file);

            const c=
                document.createElement(
                    "canvas"
                );

            c.width=img.naturalWidth;
            c.height=img.naturalHeight;

            c.getContext("2d")
                .drawImage(img,0,0);

            if(
                targetKB &&
                format==="image/jpeg"
            ){

                await new Promise(resolve=>{

                    compressImage(
                        c,
                        targetKB,
                        file.name,
                        resolve
                    );

                });

            }else{

                const blob=
                    await canvasBlob(
                        c,
                        format,
                        .9
                    );

                download(
                    blob,
                    file.name.replace(
                        /\.[^/.]+$/,
                        ""
                    )+
                    (
                        format==="image/png"
                        ?".png"
                        :".jpg"
                    )
                );

            }

        }

        alert("Images processed successfully!");

        queue=[];

        document.getElementById(
            "resize-queue"
        ).innerHTML="";

        btn.classList.add("hidden");

    }catch(error){

        alert(
            "Resize Error: "+
            error.message
        );

    }

    btn.disabled=false;
    btn.innerText=
        "Compress & Download Images";

}


function compressImage(
    canvas,
    targetKB,
    name,
    done
){

    const target=
        targetKB*1024;

    let low=.05;
    let high=1;
    let q=.7;

    let best=null;
    let bestDiff=Infinity;
    let count=0;

    function test(){

        canvas.toBlob(
            blob=>{

                count++;

                if(!blob){

                    done();
                    return;

                }

                const diff=
                    Math.abs(
                        blob.size-target
                    );

                if(diff<bestDiff){

                    bestDiff=diff;
                    best=blob;

                }

                if(
                    count>=12 ||
                    diff<2048
                ){

                    download(
                        best,
                        name.replace(
                            /\.[^/.]+$/,
                            ""
                        )+".jpg"
                    );

                    done();

                    return;

                }

                if(blob.size>target){

                    high=q;

                }else{

                    low=q;

                }

                q=(low+high)/2;

                test();

            },
            "image/jpeg",
            q
        );

    }

    test();

}


/* =====================================================
SCAN INPUT
===================================================== */

function handleScanFile(file){

    if(!file)return;

    openScanner(file);

}


function handleGallery(files){

    if(!files || !files.length)return;

    /*
    Current page opens first image.
    */

    openScanner(files[0]);

}


/* =====================================================
OPEN SCANNER
===================================================== */

function openScanner(file){

    const reader=
        new FileReader();

    reader.onload=e=>{

        const img=
            new Image();

        img.onload=()=>{

            /*
            Keep working canvas reasonably HD
            while avoiding mobile memory crash.
            */

            const MAX=3000;

            let w=img.naturalWidth;
            let h=img.naturalHeight;

            const scale=
                Math.min(
                    1,
                    MAX/Math.max(w,h)
                );

            sourceCanvas=
                document.createElement(
                    "canvas"
                );

            sourceCanvas.width=
                Math.max(
                    1,
                    Math.round(w*scale)
                );

            sourceCanvas.height=
                Math.max(
                    1,
                    Math.round(h*scale)
                );

            sourceCanvas
                .getContext("2d")
                .drawImage(
                    img,
                    0,
                    0,
                    sourceCanvas.width,
                    sourceCanvas.height
                );

            editingIndex=-1;

            filterMode="original";

            updateFilterButtons();

            resetCrop();

            document
                .getElementById(
                    "review-workspace"
                )
                .classList.remove(
                    "hidden"
                );

            /*
            Draw first.
            Auto detection then runs.
            */

            drawEditor();

            setTimeout(
                ()=>autoDetect(),
                100
            );

        };

        img.onerror=()=>{

            alert(
                "Could not open this image."
            );

        };

        img.src=e.target.result;

    };

    reader.onerror=()=>{

        alert(
            "Could not read image."
        );

    };

    reader.readAsDataURL(file);

}


/* =====================================================
RESET CROP
===================================================== */

function resetCrop(){

    corners=[
        {x:.03,y:.03},
        {x:.97,y:.03},
        {x:.97,y:.97},
        {x:.03,y:.97}
    ];

    freeCrop={
        left:.03,
        top:.03,
        right:.97,
        bottom:.97
    };

    dragCorner=-1;
    dragFree=false;
    drawingFree=false;

    drawEditor();

}


/* =====================================================
CROP MODE
===================================================== */

function setCropMode(mode){

    cropMode=mode;

    document
        .getElementById(
            "perspective-mode"
        )
        .classList.toggle(
            "active",
            mode==="perspective"
        );

    document
        .getElementById(
            "free-mode"
        )
        .classList.toggle(
            "active",
            mode==="free"
        );

    drawEditor();

}


/* =====================================================
EDITOR SIZE
===================================================== */

function getEditorSize(){

    const area=
        document.querySelector(
            ".editor-area"
        );

    const rect=
        area.getBoundingClientRect();

    const maxW=
        Math.max(
            100,
            rect.width-10
        );

    const maxH=
        Math.max(
            100,
            rect.height-10
        );

    const scale=
        Math.min(
            maxW/sourceCanvas.width,
            maxH/sourceCanvas.height,
            1
        );

    return{
        width:Math.max(
            1,
            Math.round(
                sourceCanvas.width*scale
            )
        ),

        height:Math.max(
            1,
            Math.round(
                sourceCanvas.height*scale
            )
        )
    };

}


/* =====================================================
FILTER PREVIEW
===================================================== */

function createFilteredCanvas(){

    const c=
        document.createElement(
            "canvas"
        );

    c.width=sourceCanvas.width;
    c.height=sourceCanvas.height;

    const ctx=c.getContext("2d");

    ctx.drawImage(
        sourceCanvas,
        0,
        0
    );

    applyFilter(c);

    return c;

}


/* =====================================================
DRAW EDITOR
===================================================== */

function drawEditor(){

    if(!sourceCanvas)return;

    const size=
        getEditorSize();

    canvas.width=size.width;
    canvas.height=size.height;

    const ctx=
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /*
    THIS FIXES THE FILTER PREVIEW ISSUE.
    */

    const preview=
        createFilteredCanvas();

    ctx.drawImage(
        preview,
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(cropMode==="perspective"){

        drawPerspectiveOverlay(ctx);

    }else{

        drawFreeOverlay(ctx);

    }

}


/* =====================================================
PERSPECTIVE OVERLAY
===================================================== */

function drawPerspectiveOverlay(ctx){

    const p=
        corners.map(c=>({

            x:c.x*canvas.width,
            y:c.y*canvas.height

        }));

    /*
    Dark outside area.
    */

    ctx.save();

    ctx.fillStyle=
        "rgba(0,0,0,.55)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /*
    Restore selected area
    */

    ctx.beginPath();

    ctx.moveTo(
        p[0].x,
        p[0].y
    );

    p.slice(1).forEach(point=>{

        ctx.lineTo(
            point.x,
            point.y
        );

    });

    ctx.closePath();

    ctx.clip();

    ctx.drawImage(
        createFilteredCanvas(),
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.restore();

    /*
    Border
    */

    ctx.strokeStyle="#818cf8";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
        p[0].x,
        p[0].y
    );

    p.slice(1).forEach(point=>{

        ctx.lineTo(
            point.x,
            point.y
        );

    });

    ctx.closePath();

    ctx.stroke();

    /*
    Corner handles
    */

    p.forEach(point=>{

        drawHandle(
            ctx,
            point.x,
            point.y
        );

    });

}


/* =====================================================
FREE CROP OVERLAY
===================================================== */

function drawFreeOverlay(ctx){

    const x=
        freeCrop.left*
        canvas.width;

    const y=
        freeCrop.top*
        canvas.height;

    const w=
        (
            freeCrop.right-
            freeCrop.left
        )*
        canvas.width;

    const h=
        (
            freeCrop.bottom-
            freeCrop.top
        )*
        canvas.height;

    /*
    Dark entire canvas.
    */

    ctx.fillStyle=
        "rgba(0,0,0,.55)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /*
    Show selected image area again.
    */

    ctx.save();

    ctx.beginPath();

    ctx.rect(
        x,
        y,
        w,
        h
    );

    ctx.clip();

    ctx.drawImage(
        createFilteredCanvas(),
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.restore();

    /*
    Crop border
    */

    ctx.strokeStyle="#818cf8";
    ctx.lineWidth=3;

    ctx.strokeRect(
        x,
        y,
        w,
        h
    );

    /*
    Rule of thirds
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.35)";

    ctx.lineWidth=1;

    for(let i=1;i<3;i++){

        const xx=
            x+(w*i/3);

        const yy=
            y+(h*i/3);

        ctx.beginPath();

        ctx.moveTo(
            xx,
            y
        );

        ctx.lineTo(
            xx,
            y+h
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            x,
            yy
        );

        ctx.lineTo(
            x+w,
            yy
        );

        ctx.stroke();

    }

    /*
    Handles
    */

    drawHandle(
        ctx,
        x,
        y
    );

    drawHandle(
        ctx,
        x+w,
        y
    );

    drawHandle(
        ctx,
        x+w,
        y+h
    );

    drawHandle(
        ctx,
        x,
        y+h
    );

}


/* =====================================================
HANDLE
===================================================== */

function drawHandle(ctx,x,y){

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        11,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#6366f1";
    ctx.fill();

    ctx.strokeStyle="#fff";
    ctx.lineWidth=2;
    ctx.stroke();

}


/* =====================================================
POINTER POSITION
===================================================== */

function pointer(e){

    const r=
        canvas.getBoundingClientRect();

    return{

        x:clamp(
            (e.clientX-r.left)/r.width,
            0,
            1
        ),

        y:clamp(
            (e.clientY-r.top)/r.height,
            0,
            1
        )

    };

}


/* =====================================================
DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =====================================================
FREE CROP HANDLE
===================================================== */

function getFreeCorner(p){

    const handles=[
        {
            index:0,
            x:freeCrop.left,
            y:freeCrop.top
        },

        {
            index:1,
            x:freeCrop.right,
            y:freeCrop.top
        },

        {
            index:2,
            x:freeCrop.right,
            y:freeCrop.bottom
        },

        {
            index:3,
            x:freeCrop.left,
            y:freeCrop.bottom
        }
    ];

    let found=-1;
    let best=.06;

    handles.forEach(h=>{

        const d=
            Math.hypot(
                h.x-p.x,
                h.y-p.y
            );

        if(d<best){

            best=d;
            found=h.index;

        }

    });

    return found;

}


/* =====================================================
POINTER DOWN
===================================================== */

canvas.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        const p=
            pointer(e);

        if(cropMode==="perspective"){

            let nearest=-1;
            let best=.07;

            corners.forEach(
                (c,i)=>{

                    const d=
                        distance(c,p);

                    if(d<best){

                        best=d;
                        nearest=i;

                    }

                }
            );

            dragCorner=nearest;

        }else{

            /*
            First check corner.
            */

            const corner=
                getFreeCorner(p);

            if(corner>=0){

                dragCorner=corner;

            }else{

                /*
                If inside current crop,
                move entire crop.
                */

                const inside=
                    p.x>freeCrop.left &&
                    p.x<freeCrop.right &&
                    p.y>freeCrop.top &&
                    p.y<freeCrop.bottom;

                if(inside){

                    dragFree=true;

                    dragStart={
                        x:p.x,
                        y:p.y,
                        left:freeCrop.left,
                        right:freeCrop.right,
                        top:freeCrop.top,
                        bottom:freeCrop.bottom
                    };

                }else{

                    /*
                    IMPORTANT:
                    Touch/click anywhere outside
                    starts a brand new free crop.
                    */

                    drawingFree=true;

                    freeStart={
                        x:p.x,
                        y:p.y
                    };

                    freeCrop={
                        left:p.x,
                        top:p.y,
                        right:p.x,
                        bottom:p.y
                    };

                }

            }

        }

        try{
            canvas.setPointerCapture(
                e.pointerId
            );
        }catch{}

        drawEditor();

    }
);


/* =====================================================
POINTER MOVE
===================================================== */

canvas.addEventListener(
    "pointermove",
    e=>{

        e.preventDefault();

        const p=
            pointer(e);

        if(cropMode==="perspective"){

            if(dragCorner<0)return;

            corners[dragCorner].x=p.x;
            corners[dragCorner].y=p.y;

            drawEditor();

            return;

        }


        /* =========================
        FREE CROP RESIZE
        ========================= */

        if(dragCorner>=0){

            if(dragCorner===0){

                freeCrop.left=
                    Math.min(
                        p.x,
                        freeCrop.right-.02
                    );

                freeCrop.top=
                    Math.min(
                        p.y,
                        freeCrop.bottom-.02
                    );

            }

            if(dragCorner===1){

                freeCrop.right=
                    Math.max(
                        p.x,
                        freeCrop.left+.02
                    );

                freeCrop.top=
                    Math.min(
                        p.y,
                        freeCrop.bottom-.02
                    );

            }

            if(dragCorner===2){

                freeCrop.right=
                    Math.max(
                        p.x,
                        freeCrop.left+.02
                    );

                freeCrop.bottom=
                    Math.max(
                        p.y,
                        freeCrop.top+.02
                    );

            }

            if(dragCorner===3){

                freeCrop.left=
                    Math.min(
                        p.x,
                        freeCrop.right-.02
                    );

                freeCrop.bottom=
                    Math.max(
                        p.y,
                        freeCrop.top+.02
                    );

            }

            drawEditor();

            return;

        }


        /* =========================
        MOVE FREE CROP
        ========================= */

        if(dragFree && dragStart){

            const dx=
                p.x-dragStart.x;

            const dy=
                p.y-dragStart.y;

            const width=
                dragStart.right-
                dragStart.left;

            const height=
                dragStart.bottom-
                dragStart.top;

            let left=
                dragStart.left+dx;

            let top=
                dragStart.top+dy;

            left=clamp(
                left,
                0,
                1-width
            );

            top=clamp(
                top,
                0,
                1-height
            );

            freeCrop.left=left;
            freeCrop.right=
                left+width;

            freeCrop.top=top;
            freeCrop.bottom=
                top+height;

            drawEditor();

            return;

        }


        /* =========================
        DRAW NEW FREE CROP
        ========================= */

        if(drawingFree && freeStart){

            freeCrop.left=
                Math.min(
                    freeStart.x,
                    p.x
                );

            freeCrop.right=
                Math.max(
                    freeStart.x,
                    p.x
                );

            freeCrop.top=
                Math.min(
                    freeStart.y,
                    p.y
                );

            freeCrop.bottom=
                Math.max(
                    freeStart.y,
                    p.y
                );

            drawEditor();

        }

    }
);


/* =====================================================
POINTER UP
===================================================== */

canvas.addEventListener(
    "pointerup",
    e=>{

        dragCorner=-1;
        dragFree=false;
        drawingFree=false;

        dragStart=null;
        freeStart=null;

        try{

            canvas.releasePointerCapture(
                e.pointerId
            );

        }catch{}

        drawEditor();

    }
);

canvas.addEventListener(
    "pointercancel",
    e=>{

        dragCorner=-1;
        dragFree=false;
        drawingFree=false;

        dragStart=null;
        freeStart=null;

    }
);


/* =====================================================
FILTER
===================================================== */

function setFilter(
    mode,
    button
){

    filterMode=mode;

    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            b=>b.classList.remove(
                "active"
            )
        );

    button.classList.add("active");

    drawEditor();

}


/* =====================================================
FILTER BUTTON RESET
===================================================== */

function updateFilterButtons(){

    const buttons=
        document.querySelectorAll(
            ".filter-btn"
        );

    buttons.forEach(b=>{
        b.classList.remove("active");
    });

    const map={
        original:0,
        auto:1,
        bw:2,
        gray:3
    };

    if(buttons[map[filterMode]]){

        buttons[
            map[filterMode]
        ].classList.add("active");

    }

}


/* =====================================================
FILTER PROCESS
===================================================== */

function applyFilter(c){

    if(filterMode==="original")
        return;

    const ctx=
        c.getContext("2d");

    const image=
        ctx.getImageData(
            0,
            0,
            c.width,
            c.height
        );

    const d=image.data;

    for(
        let i=0;
        i<d.length;
        i+=4
    ){

        let r=d[i];
        let g=d[i+1];
        let b=d[i+2];

        const gray=
            .299*r+
            .587*g+
            .114*b;


        /* =================
        GRAY
        ================= */

        if(filterMode==="gray"){

            d[i]=gray;
            d[i+1]=gray;
            d[i+2]=gray;

        }


        /* =================
        B&W
        ================= */

        else if(filterMode==="bw"){

            /*
            Higher contrast document
            threshold.
            */

            const value=
                gray>155
                ?255
                :0;

            d[i]=value;
            d[i+1]=value;
            d[i+2]=value;

        }


        /* =================
        AUTO
        ================= */

        else if(filterMode==="auto"){

            /*
            Contrast enhancement
            + slight brightness.
            */

            let value=
                (gray-128)*1.35+
                128+
                5;

            value=
                clamp(
                    value,
                    0,
                    255
                );

            d[i]=value;
            d[i+1]=value;
            d[i+2]=value;

        }

    }

    ctx.putImageData(
        image,
        0,
        0
    );

}


/* =====================================================
FINAL CROP
===================================================== */

function createFinalCrop(){

    const src=
        sourceCanvas;

    /*
    FREE CROP
    */

    if(cropMode==="free"){

        const x=
            Math.round(
                freeCrop.left*
                src.width
            );

        const y=
            Math.round(
                freeCrop.top*
                src.height
            );

        const w=
            Math.max(
                1,
                Math.round(
                    (
                        freeCrop.right-
                        freeCrop.left
                    )*
                    src.width
                )
            );

        const h=
            Math.max(
                1,
                Math.round(
                    (
                        freeCrop.bottom-
                        freeCrop.top
                    )*
                    src.height
                )
            );

        const out=
            document.createElement(
                "canvas"
            );

        out.width=w;
        out.height=h;

        out.getContext("2d")
            .drawImage(
                src,
                x,
                y,
                w,
                h,
                0,
                0,
                w,
                h
            );

        applyFilter(out);

        return out;

    }


    /*
    4 CORNER PERSPECTIVE
    */

    const p=
        corners.map(c=>({

            x:c.x*src.width,
            y:c.y*src.height

        }));

    const tl=p[0];
    const tr=p[1];
    const br=p[2];
    const bl=p[3];

    const width=Math.max(
        Math.hypot(
            tr.x-tl.x,
            tr.y-tl.y
        ),
        Math.hypot(
            br.x-bl.x,
            br.y-bl.y
        )
    );

    const height=Math.max(
        Math.hypot(
            bl.x-tl.x,
            bl.y-tl.y
        ),
        Math.hypot(
            br.x-tr.x,
            br.y-tr.y
        )
    );

    const outW=
        Math.max(
            1,
            Math.round(width)
        );

    const outH=
        Math.max(
            1,
            Math.round(height)
        );


    /*
    OpenCV perspective correction
    */

    if(
        window.cv &&
        cv.Mat
    ){

        try{

            const srcMat=
                cv.imread(src);

            const dstMat=
                new cv.Mat();

            const srcPts=
                cv.matFromArray(
                    4,
                    1,
                    cv.CV_32FC2,
                    [
                        tl.x,tl.y,
                        tr.x,tr.y,
                        br.x,br.y,
                        bl.x,bl.y
                    ]
                );

            const dstPts=
                cv.matFromArray(
                    4,
                    1,
                    cv.CV_32FC2,
                    [
                        0,0,
                        outW,0,
                        outW,outH,
                        0,outH
                    ]
                );

            const matrix=
                cv.getPerspectiveTransform(
                    srcPts,
                    dstPts
                );

            cv.warpPerspective(
                srcMat,
                dstMat,
                matrix,
                new cv.Size(
                    outW,
                    outH
                ),
                cv.INTER_LINEAR,
                cv.BORDER_REPLICATE,
                new cv.Scalar()
            );

            const out=
                document.createElement(
                    "canvas"
                );

            out.width=outW;
            out.height=outH;

            cv.imshow(
                out,
                dstMat
            );

            applyFilter(out);

            srcMat.delete();
            dstMat.delete();
            srcPts.delete();
            dstPts.delete();
            matrix.delete();

            return out;

        }catch(error){

            console.log(
                "Perspective correction:",
                error
            );

        }

    }


    /*
    Fallback if OpenCV isn't ready
    */

    const out=
        document.createElement(
            "canvas"
        );

    out.width=outW;
    out.height=outH;

    const minX=
        Math.min(
            tl.x,
            bl.x
        );

    const minY=
        Math.min(
            tl.y,
            tr.y
        );

    const maxX=
        Math.max(
            tr.x,
            br.x
        );

    const maxY=
        Math.max(
            bl.y,
            br.y
        );

    out.getContext("2d")
        .drawImage(
            src,
            minX,
            minY,
            Math.max(
                1,
                maxX-minX
            ),
            Math.max(
                1,
                maxY-minY
            ),
            0,
            0,
            outW,
            outH
        );

    applyFilter(out);

    return out;

}


/* =====================================================
KEEP PAGE
===================================================== */

function keepPage(){

    if(!sourceCanvas){

        return;

    }

    try{

        const finalCanvas=
            createFinalCrop();

        const url=
            finalCanvas.toDataURL(
                "image/jpeg",
                .97
            );

        if(editingIndex>=0){

            scannedPages[
                editingIndex
            ]=url;

        }else{

            scannedPages.push(url);

        }

        closeEditor();

        renderPages();

        /*
        Switch to Scan tab
        */

        switchTab("scan");

        /*
        Small feedback
        */

        setTimeout(
            ()=>{
                const count=
                    scannedPages.length;

                console.log(
                    `${count} page saved`
                );
            },
            50
        );

    }catch(error){

        alert(
            "Could not save page: "+
            error.message
        );

    }

}


/* =====================================================
EDIT PAGE
===================================================== */

function editPage(index){

    if(
        !scannedPages[index]
    )return;

    const img=
        new Image();

    img.onload=()=>{

        sourceCanvas=
            document.createElement(
                "canvas"
            );

        sourceCanvas.width=
            img.naturalWidth;

        sourceCanvas.height=
            img.naturalHeight;

        sourceCanvas
            .getContext("2d")
            .drawImage(
                img,
                0,
                0
            );

        editingIndex=index;

        filterMode="original";

        cropMode="perspective";

        updateFilterButtons();

        resetCrop();

        document
            .getElementById(
                "review-workspace"
            )
            .classList.remove(
                "hidden"
            );

        drawEditor();

    };

    img.src=
        scannedPages[index];

}


/* =====================================================
AUTO DETECT
===================================================== */

function autoDetect(){

    if(!sourceCanvas){

        return;

    }

    /*
    Default crop first.
    */

    resetCrop();

    /*
    OpenCV may not be loaded yet.
    */

    if(
        !window.cv ||
        !cv.Mat
    ){

        return;

    }

    try{

        const src=
            cv.imread(
                sourceCanvas
            );

        const gray=
            new cv.Mat();

        cv.cvtColor(
            src,
            gray,
            cv.COLOR_RGBA2GRAY
        );

        const blur=
            new cv.Mat();

        cv.GaussianBlur(
            gray,
            blur,
            new cv.Size(5,5),
            0
        );

        const edges=
            new cv.Mat();

        cv.Canny(
            blur,
            edges,
            50,
            150
        );

        const contours=
            new cv.MatVector();

        const hierarchy=
            new cv.Mat();

        cv.findContours(
            edges,
            contours,
            hierarchy,
            cv.RETR_LIST,
            cv.CHAIN_APPROX_SIMPLE
        );

        let best=null;
        let bestArea=0;

        for(
            let i=0;
            i<contours.size();
            i++
        ){

            const contour=
                contours.get(i);

            const area=
                cv.contourArea(
                    contour
                );

            if(area>bestArea){

                const perimeter=
                    cv.arcLength(
                        contour,
                        true
                    );

                const approx=
                    new cv.Mat();

                cv.approxPolyDP(
                    contour,
                    approx,
                    .02*perimeter,
                    true
                );

                if(
                    approx.rows===4 &&
                    area>
                    sourceCanvas.width*
                    sourceCanvas.height*
                    .15
                ){

                    if(best){

                        best.delete();

                    }

                    best=approx;
                    bestArea=area;

                }else{

                    approx.delete();

                }

            }

            contour.delete();

        }

        if(best){

            let points=[];

            for(
                let i=0;
                i<4;
                i++
            ){

                points.push({

                    x:best.intAt(i,0),
                    y:best.intAt(i,1)

                });

            }

            points=
                orderPoints(points);

            corners=
                points.map(p=>({

                    x:
                        clamp(
                            p.x/
                            sourceCanvas.width,
                            0,
                            1
                        ),

                    y:
                        clamp(
                            p.y/
                            sourceCanvas.height,
                            0,
                            1
                        )

                }));

            best.delete();

        }

        src.delete();
        gray.delete();
        blur.delete();
        edges.delete();
        contours.delete();
        hierarchy.delete();

    }catch(error){

        console.log(
            "Auto detect error:",
            error
        );

    }

    drawEditor();

}


/* =====================================================
ORDER POINTS
===================================================== */

function orderPoints(points){

    const sum=
        p=>p.x+p.y;

    const diff=
        p=>p.x-p.y;

    const tl=
        points.reduce(
            (a,b)=>
                sum(a)<sum(b)
                ?a
                :b
        );

    const br=
        points.reduce(
            (a,b)=>
                sum(a)>sum(b)
                ?a
                :b
        );

    const tr=
        points.reduce(
            (a,b)=>
                diff(a)>diff(b)
                ?a
                :b
        );

    const bl=
        points.reduce(
            (a,b)=>
                diff(a)<diff(b)
                ?a
                :b
        );

    return[
        tl,
        tr,
        br,
        bl
    ];

}


/* =====================================================
ROTATE
===================================================== */

function rotateImage(){

    if(!sourceCanvas)return;

    const old=
        sourceCanvas;

    const out=
        document.createElement(
            "canvas"
        );

    out.width=
        old.height;

    out.height=
        old.width;

    const ctx=
        out.getContext("2d");

    ctx.translate(
        out.width/2,
        out.height/2
    );

    ctx.rotate(
        Math.PI/2
    );

    ctx.drawImage(
        old,
        -old.width/2,
        -old.height/2
    );

    sourceCanvas=out;

    resetCrop();

}


/* =====================================================
CLOSE EDITOR
===================================================== */

function closeEditor(){

    sourceCanvas=null;

    editingIndex=-1;

    dragCorner=-1;
    dragFree=false;
    drawingFree=false;

    document
        .getElementById(
            "review-workspace"
        )
        .classList.add(
            "hidden"
        );

}


/* =====================================================
RENDER PAGES
===================================================== */

function renderPages(){

    const grid=
        document.getElementById(
            "scanned-grid"
        );

    grid.innerHTML="";

    scannedPages.forEach(
        (url,index)=>{

            const item=
                document.createElement(
                    "div"
                );

            item.className=
                "grid-thumb";

            const img=
                document.createElement(
                    "img"
                );

            img.src=url;

            img.alt=
                `Scanned Page ${index+1}`;

            img.onclick=()=>{
                editPage(index);
            };

            const number=
                document.createElement(
                    "div"
                );

            number.className=
                "page-number";

            number.innerText=
                `Page ${index+1}`;

            const del=
                document.createElement(
                    "button"
                );

            del.className=
                "delete-page";

            del.innerText="×";

            del.onclick=e=>{

                e.stopPropagation();

                deletePage(index);

            };

            item.appendChild(img);
            item.appendChild(number);
            item.appendChild(del);

            grid.appendChild(item);

        }
    );

    updateSaveUI();

}


/* =====================================================
DELETE PAGE
===================================================== */

function deletePage(index){

    if(
        !confirm(
            `Delete Page ${index+1}?`
        )
    ){

        return;

    }

    scannedPages.splice(
        index,
        1
    );

    renderPages();

}


/* =====================================================
SAVE UI
===================================================== */

function updateSaveUI(){

    const hasPages=
        scannedPages.length>0;

    const saveBox=
        document.getElementById(
            "save-box"
        );

    const saveBar=
        document.getElementById(
            "scan-save-bar"
        );

    const pageCount=
        document.getElementById(
            "page-count"
        );

    const saveBarPages=
        document.getElementById(
            "save-bar-pages"
        );

    const text=
        `${scannedPages.length} `+
        (
            scannedPages.length===1
            ?"Page"
            :"Pages"
        );

    pageCount.innerText=text;

    saveBarPages.innerText=text;

    /*
    Normal save box only on Scan page.
    */

    saveBox.classList.toggle(
        "hidden",
        !hasPages
    );

    /*
    Fixed save bar visible only
    when scan tab is active and
    pages exist.
    */

    saveBar.classList.toggle(
        "hidden",
        !hasPages ||
        activeTab!=="scan"
    );

}


/* =====================================================
SAVE SCANNED PDF
===================================================== */

async function saveScannedPDF(){

    if(!scannedPages.length){

        alert(
            "Please scan at least one page."
        );

        return;

    }

    let filename=
        prompt(
            "Enter PDF file name:",
            "HD_Scanned_Document"
        );

    if(!filename)return;

    filename=
        filename.trim();

    if(!filename){

        filename=
            "HD_Scanned_Document";

    }

    const btn=
        document.getElementById(
            "save-pdf-btn"
        );

    const originalText=
        btn.innerText;

    btn.disabled=true;
    btn.innerText=
        "Creating PDF... ⏳";

    try{

        const pdf=
            await PDFLib.PDFDocument.create();

        const pageSize=
            document.getElementById(
                "pdf-size"
            ).value;

        const quality=
            parseFloat(
                document.getElementById(
                    "pdf-quality"
                ).value
            );

        for(
            const url of scannedPages
        ){

            const img=
                await loadImage(url);

            /*
            Re-compress based on selected
            PDF quality.
            */

            const c=
                document.createElement(
                    "canvas"
                );

            c.width=
                img.naturalWidth;

            c.height=
                img.naturalHeight;

            c.getContext("2d")
                .drawImage(
                    img,
                    0,
                    0
                );

            const blob=
                await canvasBlob(
                    c,
                    "image/jpeg",
                    quality
                );

            if(!blob){

                throw new Error(
                    "Image conversion failed."
                );

            }

            const bytes=
                await blob.arrayBuffer();

            const embedded=
                await pdf.embedJpg(
                    bytes
                );

            let width=
                embedded.width;

            let height=
                embedded.height;


            /* =====================
            A4
            ===================== */

            if(pageSize==="a4"){

                const A4W=595;
                const A4H=842;

                const scale=
                    Math.min(
                        A4W/width,
                        A4H/height
                    );

                width*=scale;
                height*=scale;

                const page=
                    pdf.addPage([
                        A4W,
                        A4H
                    ]);

                page.drawImage(
                    embedded,
                    {
                        x:
                            (A4W-width)/2,

                        y:
                            (A4H-height)/2,

                        width,
                        height
                    }
                );

                continue;

            }


            /* =====================
            LETTER
            ===================== */

            if(pageSize==="letter"){

                const W=612;
                const H=792;

                const scale=
                    Math.min(
                        W/width,
                        H/height
                    );

                width*=scale;
                height*=scale;

                const page=
                    pdf.addPage([
                        W,
                        H
                    ]);

                page.drawImage(
                    embedded,
                    {
                        x:
                            (W-width)/2,

                        y:
                            (H-height)/2,

                        width,
                        height
                    }
                );

                continue;

            }


            /* =====================
            ORIGINAL
            ===================== */

            const maxPoints=900;

            const scale=
                Math.min(
                    1,
                    maxPoints/
                    Math.max(
                        width,
                        height
                    )
                );

            width*=scale;
            height*=scale;

            const page=
                pdf.addPage([
                    width,
                    height
                ]);

            page.drawImage(
                embedded,
                {
                    x:0,
                    y:0,
                    width,
                    height
                }
            );

        }

        const bytes=
            await pdf.save();

        download(
            new Blob(
                [bytes],
                {
                    type:
                    "application/pdf"
                }
            ),
            filename.endsWith(".pdf")
                ?filename
                :filename+".pdf"
        );

        btn.innerText=
            "✅ PDF SAVED";

        setTimeout(
            ()=>{
                btn.innerText=
                    "💾 SAVE AS PDF";
            },
            1800
        );

    }catch(error){

        alert(
            "PDF Error: "+
            error.message
        );

        btn.innerText=
            originalText;

    }

    btn.disabled=false;

}


/* =====================================================
HELPERS
===================================================== */

function loadImageFromFile(file){

    return new Promise(
        (resolve,reject)=>{

            const reader=
                new FileReader();

            reader.onload=e=>{

                const img=
                    new Image();

                img.onload=()=>{
                    resolve(img);
                };

                img.onerror=reject;

                img.src=
                    e.target.result;

            };

            reader.onerror=reject;

            reader.readAsDataURL(file);

        }
    );

}


function loadImage(url){

    return new Promise(
        (resolve,reject)=>{

            const img=
                new Image();

            img.onload=()=>{
                resolve(img);
            };

            img.onerror=reject;

            img.src=url;

        }
    );

}


function canvasBlob(
    canvas,
    type,
    quality
){

    return new Promise(
        resolve=>{

            canvas.toBlob(
                resolve,
                type,
                quality
            );

        }
    );

}


function download(
    blob,
    name
){

    if(!blob){

        alert(
            "Could not create file."
        );

        return;

    }

    const a=
        document.createElement(
            "a"
        );

    const url=
        URL.createObjectURL(
            blob
        );

    a.href=url;
    a.download=name;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        ()=>{
            URL.revokeObjectURL(url);
        },
        1500
    );

}


function escapeHTML(text){

    return String(text)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


function formatBytes(bytes){

    if(bytes<1024){

        return bytes+" B";

    }

    if(bytes<1024*1024){

        return(
            bytes/1024
        ).toFixed(1)+" KB";

    }

    return(
        bytes/(1024*1024)
    ).toFixed(1)+" MB";

}


function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}
