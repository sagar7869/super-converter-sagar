<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Converter Pro</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f8fafc; margin: 0; padding: 15px; text-align: center; color: #1e293b; }
        
        h1 { font-size: 22px; margin-bottom: 2px; color: #0f172a; }
        p.subtitle { font-size: 13px; color: #64748b; margin-top: 0; margin-bottom: 20px; }

        /* Navigation Cards */
        .tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .tool-card { background: white; border: 1.5px solid #e2e8f0; padding: 12px 5px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; color: #475569; transition: all 0.2s; }
        .tool-card.active { border-color: #4f46e5; background: #eef2ff; color: #4f46e5; }

        /* General Containers */
        .panel { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .hidden { display: none !important; }
        
        /* Dropzone */
        .drop-zone { border: 2px dashed #cbd5e1; border-radius: 10px; padding: 30px 20px; cursor: pointer; background: #f8fafc; }
        .drop-zone p { margin: 0; font-size: 14px; color: #475569; }

        /* Options & Buttons */
        .options-panel { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; text-align: left; }
        .options-panel label { font-size: 12px; font-weight: 600; color: #475569; }
        .options-panel input, .options-panel select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
        
        .primary-btn { background: #4f46e5; color: white; border: none; padding: 14px; font-size: 15px; border-radius: 10px; cursor: pointer; font-weight: 600; width: 100%; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3); }
        .primary-btn:active { transform: scale(0.98); }
        .success-btn { background: #10b981; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.3); }

        .file-item { background: #f8fafc; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }

        /* --- PROFESSIONAL SCANNER UX --- */
        #scanner-dashboard { text-align: center; }
        .scan-welcome-box { padding: 30px 10px; }
        .scan-welcome-box p { color: #64748b; font-size: 14px; margin-bottom: 20px; }

        /* Active Camera Modal / Full View */
        #active-camera-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; display: flex; flex-direction: column; justify-content: space-between; }
        .cam-header { display: flex; justify-content: space-between; padding: 15px 20px; align-items: center; background: rgba(0,0,0,0.4); }
        .cam-header button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; font-weight: 600; }
        
        .cam-viewport { position: relative; flex-grow: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }
        
        .cam-footer { padding: 25px; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.6); }
        .shutter-btn { width: 72px; height: 72px; border-radius: 50%; background: white; border: 4px solid #cbd5e1; cursor: pointer; outline: none; }
        .shutter-btn:active { background: #e2e8f0; transform: scale(0.95); }

        /* Scanned Pages Grid (Big Previews) */
        .scanned-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; max-height: 350px; overflow-y: auto; padding: 4px; }
        .grid-thumb { position: relative; background: #e2e8f0; border-radius: 8px; overflow: hidden; aspect-ratio: 3/4; border: 1px solid #cbd5e1; }
        .grid-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .grid-thumb button { position: absolute; top: 6px; right: 6px; background: rgba(239, 68, 68, 0.9); color: white; border: none; border-radius: 50%; width: 26px; height: 26px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Super Converter Pro</h1>
    <p class="subtitle">Fast, Secure & Local Client-Side Processing</p>

    <!-- Navigation Tabs -->
    <div class="tool-grid">
        <button class="tool-card active" id="tab-merge" onclick="switchTab('merge')">Merge PDF</button>
        <button class="tool-card" id="tab-resize" onclick="switchTab('resize')">Image Resizer</button>
        <button class="tool-card" id="tab-scan" onclick="switchTab('scan')">Smart Scan</button>
    </div>

    <!-- 1. MERGE PDF PANEL -->
    <div id="panel-merge" class="panel">
        <div class="drop-zone" onclick="document.getElementById('file-input-merge').click()">
            <p>📂 Tap to select PDF files</p>
            <input type="file" id="file-input-merge" accept="application/pdf" multiple hidden onchange="handleQueueFiles(this.files, 'pdf')">
        </div>
        <div id="queue-merge" style="margin-top: 15px;"></div>
        <button id="btn-process-merge" class="primary-btn hidden" style="margin-top: 15px;" onclick="executeMerge()">Merge & Download PDF</button>
    </div>

    <!-- 2. IMAGE RESIZER PANEL -->
    <div id="panel-resize" class="panel hidden">
        <div class="options-panel">
            <label>Target Size Constraint:</label>
            <div style="display: flex; gap: 8px;">
                <input type="number" id="resize-size" placeholder="e.g. 150" style="flex: 2;">
                <select id="resize-unit" style="flex: 1;"><option value="KB">KB</option><option value="MB">MB</option></select>
            </div>
            <label>Export Format:</label>
            <select id="resize-fmt"><option value="image/jpeg">JPG (Supports KB compression)</option><option value="image/png">PNG</option></select>
        </div>
        
        <div class="drop-zone" onclick="document.getElementById('file-input-resize').click()">
            <p>🖼️ Tap to select Images</p>
            <input type="file" id="file-input-resize" accept="image/*" multiple hidden onchange="handleQueueFiles(this.files, 'image')">
        </div>
        <div id="queue-resize" style="margin-top: 15px;"></div>
        <button id="btn-process-resize" class="primary-btn hidden" style="margin-top: 15px;" onclick="executeResize()">Compress & Download Images</button>
    </div>

    <!-- 3. SMART SCANNER PANEL (Dashboard View) -->
    <div id="panel-scan" class="panel hidden">
        <div id="scanner-dashboard">
            <div class="scan-welcome-box">
                <p>Scan multi-page documents instantly using your device camera.</p>
                <button class="primary-btn" onclick="openCameraModal()">📷 Open Camera Scanner</button>
            </div>
            
            <!-- Grid Preview of Scanned Pages -->
            <div id="scanned-pages-grid" class="scanned-grid"></div>
            
            <button id="btn-save-scans" class="primary-btn success-btn hidden" style="margin-top: 15px;" onclick="generateScannedPDF()">💾 Save as PDF</button>
        </div>
    </div>

    <!-- FULLSCREEN CAMERA OVERLAY MODAL -->
    <div id="active-camera-overlay" class="hidden">
        <div class="cam-header">
            <button onclick="toggleFlashLight()" id="flash-toggle-btn">⚡ Flash</button>
            <span id="page-count-badge" style="color: white; font-weight: 600;">0 Pages</span>
            <button onclick="closeCameraModal()" style="color: #f87171;">Done / Close</button>
        </div>
        
        <div class="cam-viewport">
            <video id="camera-feed" autoplay playsinline></video>
        </div>
        
        <div class="cam-footer">
            <button class="shutter-btn" onclick="captureCameraPhoto()"></button>
        </div>
    </div>

    <canvas id="hidden-canvas" hidden></canvas>

    <script>
        // --- GLOBAL APP STATE ---
        let activeTab = 'merge';
        let processingQueue = [];
        
        // Scanner State
        let mediaStream = null;
        let activeVideoTrack = null;
        let flashState = false;
        let scannedPagesBuffer = [];

        // --- TAB SWITCHING ---
        function switchTab(tab) {
            activeTab = tab;
            processingQueue = [];
            
            ['merge', 'resize', 'scan'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
                document.getElementById(`panel-${t}`).classList.toggle('hidden', t !== tab);
            });
            
            if (tab !== 'scan') {
                closeCameraModal();
            }
        }

        // --- QUEUE MANAGEMENT (MERGE & RESIZE) ---
        function handleQueueFiles(files, type) {
            if (files.length === 0) return;
            processingQueue = Array.from(files);
            
            let html = '';
            processingQueue.forEach(f => {
                html += `<div class="file-item"><span>📄 ${f.name}</span><span style="color:#64748b; font-size:12px;">${(f.size/1024).toFixed(1)} KB</span></div>`;
            });
            
            if (type === 'pdf') {
                document.getElementById('queue-merge').innerHTML = html;
                document.getElementById('btn-process-merge').classList.remove('hidden');
            } else {
                document.getElementById('queue-resize').innerHTML = html;
                document.getElementById('btn-process-resize').classList.remove('hidden');
            }
        }

        // --- EXECUTING MERGE ---
        async function executeMerge() {
            const btn = document.getElementById('btn-process-merge');
            btn.innerText = "Merging... ⏳"; btn.disabled = true;
            try {
                const { PDFDocument } = window.PDFLib;
                const mergedPdf = await PDFDocument.create();
                for (let file of processingQueue) {
                    const buffer = await file.arrayBuffer();
                    const pdf = await PDFDocument.load(buffer);
                    const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    pages.forEach(p => mergedPdf.addPage(p));
                }
                const bytes = await mergedPdf.save();
                triggerDownload(new Blob([bytes], {type: 'application/pdf'}), 'Merged_Document.pdf');
                alert("PDF Merged Successfully!");
            } catch(e) { alert("Error merging: " + e.message); }
            btn.innerText = "Merge & Download PDF"; btn.disabled = false;
            processingQueue = []; document.getElementById('queue-merge').innerHTML = '';
            document.getElementById('btn-process-merge').classList.add('hidden');
        }

        // --- EXECUTING RESIZE ---
        async function executeResize() {
            const btn = document.getElementById('btn-process-resize');
            btn.innerText = "Compressing... ⏳"; btn.disabled = true;
            
            const sizeVal = document.getElementById('resize-size').value;
            const unit = document.getElementById('resize-unit').value;
            const fmt = document.getElementById('resize-fmt').value;
            const targetKB = (sizeVal && unit === 'MB') ? sizeVal * 1024 : sizeVal;

            for (let file of processingQueue) {
                if (!file.type.startsWith('image/')) continue;
                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = e => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width; canvas.height = img.height;
                            canvas.getContext('2d').drawImage(img, 0, 0);
                            
                            if (targetKB && fmt === 'image/jpeg') {
                                smartCompressImage(canvas, targetKB, file.name, resolve);
                            } else {
                                canvas.toBlob(blob => {
                                    triggerDownload(blob, file.name.replace(/\.[^/.]+$/, "") + (fmt==='image/png'?'.png':'.jpg'));
                                    resolve();
                                }, fmt, 0.9);
                            }
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }
            alert("Images Processed!");
            btn.innerText = "Compress & Download Images"; btn.disabled = false;
            processingQueue = []; document.getElementById('queue-resize').innerHTML = '';
            document.getElementById('btn-process-resize').classList.add('hidden');
        }

        function smartCompressImage(canvas, targetKB, name, callback) {
            const targetBytes = targetKB * 1024;
            let minQ = 0.05, maxQ = 1.0, curQ = 0.6, attempts = 0;
            let bestBlob = null, closest = Infinity;

            function loop() {
                canvas.toBlob(blob => {
                    if(!blob) return callback();
                    attempts++;
                    const diff = Math.abs(blob.size - targetBytes);
                    if(diff < closest) { closest = diff; bestBlob = blob; }
                    if(diff <= 2048 || attempts >= 10) {
                        triggerDownload(bestBlob, name.replace(/\.[^/.]+$/, "") + ".jpg");
                        callback(); return;
                    }
                    if(blob.size > targetBytes) maxQ = curQ; else minQ = curQ;
                    curQ = (minQ + maxQ) / 2;
                    loop();
                }, 'image/jpeg', curQ);
            }
            loop();
        }

        // --- SCANNER LOGIC (PROFESSIONAL WORKFLOW) ---
        async function openCameraModal() {
            document.getElementById('active-camera-overlay').classList.remove('hidden');
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const video = document.getElementById('camera-feed');
                video.srcObject = mediaStream;
                activeVideoTrack = mediaStream.getVideoTracks()[0];
                
                // Hide flash button if torch unsupported
                if (!activeVideoTrack.getCapabilities().torch) {
                    document.getElementById('flash-toggle-btn').style.display = 'none';
                }
            } catch(err) {
                alert("Camera Access Denied or Unavailable: " + err.message);
                closeCameraModal();
            }
        }

        function closeCameraModal() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            if (flashState) toggleFlashLight();
            document.getElementById('active-camera-overlay').classList.add('hidden');
            renderScannerGrid();
        }

        async function toggleFlashLight() {
            if(!activeVideoTrack) return;
            flashState = !flashState;
            try {
                await activeVideoTrack.applyConstraints({ advanced: [{ torch: flashState }] });
                document.getElementById('flash-toggle-btn').style.color = flashState ? "#facc15" : "white";
            } catch(e) { console.log("Torch error"); }
        }

        function captureCameraPhoto() {
            const video = document.getElementById('camera-feed');
            const canvas = document.getElementById('hidden-canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            scannedPagesBuffer.push(canvas.toDataURL('image/jpeg', 0.9));
            document.getElementById('page-count-badge').innerText = scannedPagesBuffer.length + " Pages";
            
            // Brief shutter feedback animation
            navigator.vibrate && navigator.vibrate(50);
        }

        function renderScannerGrid() {
            const grid = document.getElementById('scanned-pages-grid');
            grid.innerHTML = '';
            
            scannedPagesBuffer.forEach((imgUrl, idx) => {
                grid.innerHTML += `
                    <div class="grid-thumb">
                        <img src="${imgUrl}" alt="Page">
                        <button onclick="removeScannedPage(${idx})">×</button>
                    </div>`;
            });

            const saveBtn = document.getElementById('btn-save-scans');
            if(scannedPagesBuffer.length > 0) {
                saveBtn.classList.remove('hidden');
            } else {
                saveBtn.classList.add('hidden');
            }
        }

        function removeScannedPage(index) {
            scannedPagesBuffer.splice(index, 1);
            renderScannerGrid();
        }

        async function generateScannedPDF() {
            const fileName = prompt("Enter Document File Name:", "Scanned_Document");
            if(!fileName) return;

            const btn = document.getElementById('btn-save-scans');
            btn.innerText = "Building PDF... ⏳"; btn.disabled = true;

            try {
                const { PDFDocument } = window.PDFLib;
                const pdfDoc = await PDFDocument.create();

                for(let url of scannedPagesBuffer) {
                    const bytes = await fetch(url).then(res => res.arrayBuffer());
                    const img = await pdfDoc.embedJpg(bytes);
                    const page = pdfDoc.addPage([img.width, img.height]);
                    page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
                }

                const pdfBytes = await pdfDoc.save();
                triggerDownload(new Blob([pdfBytes], {type: 'application/pdf'}), fileName + ".pdf");
                
                alert("PDF Generated & Downloaded!");
                scannedPagesBuffer = [];
                renderScannerGrid();
            } catch(e) {
                alert("Error: " + e.message);
            }
            btn.innerText = "💾 Save as PDF"; btn.disabled = false;
        }

        function triggerDownload(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
