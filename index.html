<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Super Converter Pro - HD Studio</title>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script async src="https://docs.opencv.org/4.9.0/opencv.js"></script>

<style>
*{
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,Verdana,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    padding:15px;
    padding-bottom:130px;
    background:#0f172a;
    color:#f8fafc;
    text-align:center;
}

h1{
    font-size:20px;
    margin:0 0 2px;
}

.subtitle{
    color:#94a3b8;
    font-size:12px;
    margin:0 0 15px;
}

.tool-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:15px;
}

.tool-card{
    border:1px solid #334155;
    background:#1e293b;
    color:#94a3b8;
    border-radius:8px;
    padding:10px 3px;
    font-weight:bold;
    font-size:12px;
}

.tool-card.active{
    background:#312e81;
    border-color:#6366f1;
    color:#a5b4fc;
}

.panel{
    max-width:520px;
    margin:auto;
    padding:15px;
    border-radius:12px;
    background:#1e293b;
    border:1px solid #334155;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.hidden{
    display:none!important;
}

.drop-zone{
    background:#0f172a;
    border:2px dashed #475569;
    border-radius:10px;
    padding:25px 15px;
    cursor:pointer;
}

.primary-btn{
    width:100%;
    border:0;
    border-radius:8px;
    padding:14px;
    background:#6366f1;
    color:white;
    font-size:15px;
    font-weight:bold;
}

.success-btn{
    background:#10b981;
}

.file-item{
    display:flex;
    justify-content:space-between;
    padding:9px;
    background:#0f172a;
    border:1px solid #334155;
    border-radius:6px;
    margin-top:6px;
    font-size:12px;
}

.options-panel{
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:12px;
}

.options-panel label{
    color:#cbd5e1;
    font-size:11px;
    font-weight:bold;
}

.options-panel input,
.options-panel select,
.pdf-options select{
    width:100%;
    background:#0f172a;
    color:white;
    border:1px solid #475569;
    border-radius:6px;
    padding:9px;
}

/* CAMERA */

.camera-box{
    background:#0f172a;
    border:1px dashed #6366f1;
    border-radius:10px;
    padding:24px 10px;
    cursor:pointer;
}

.camera-title{
    color:#a5b4fc;
    font-weight:bold;
    font-size:16px;
}

.camera-sub{
    color:#94a3b8;
    font-size:11px;
    margin-top:5px;
}

/* SCANNED PAGES */

.scanned-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:12px;
}

.grid-thumb{
    position:relative;
    aspect-ratio:3/4;
    overflow:hidden;
    background:#020617;
    border:1px solid #334155;
    border-radius:8px;
}

.grid-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.delete-page{
    position:absolute;
    top:5px;
    right:5px;
    width:26px;
    height:26px;
    border:0;
    border-radius:50%;
    background:#ef4444;
    color:white;
    font-weight:bold;
}

.page-number{
    position:absolute;
    bottom:5px;
    left:5px;
    padding:3px 7px;
    background:rgba(0,0,0,.75);
    border-radius:10px;
    font-size:10px;
}

/* SAVE */

.save-box{
    margin-top:15px;
    padding:12px;
    background:#0f172a;
    border:1px solid #334155;
    border-radius:10px;
}

.pdf-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-bottom:8px;
}

/* EDITOR */

#review-workspace{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:#020617;
    z-index:999;
    display:flex;
    flex-direction:column;
    padding:8px;
}

.review-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    height:38px;
    flex-shrink:0;
}

.editor-title{
    font-size:14px;
    font-weight:bold;
}

.cancel-btn{
    border:0;
    background:none;
    color:#f87171;
    font-weight:bold;
}

.editor-area{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#020617;
    border-radius:10px;
}

#editor-canvas{
    max-width:100%;
    max-height:100%;
    touch-action:none;
}

.editor-message{
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(15,23,42,.9);
    color:#cbd5e1;
    font-size:10px;
    padding:6px 10px;
    border-radius:20px;
    pointer-events:none;
    white-space:nowrap;
}

/* MODE */

.mode-bar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin:6px 0;
}

.mode-btn{
    background:#334155;
    color:#f8fafc;
    border:0;
    padding:9px;
    border-radius:7px;
    font-size:11px;
    font-weight:bold;
}

.mode-btn.active{
    background:#4f46e5;
}

/* FILTER */

.filter-bar{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
}

.filter-btn{
    border:0;
    background:#334155;
    color:#e2e8f0;
    padding:9px 2px;
    border-radius:7px;
    font-size:10px;
    font-weight:bold;
}

.filter-btn.active{
    background:#4f46e5;
}

/* EDITOR BUTTONS */

.editor-buttons{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    margin-top:6px;
    flex-shrink:0;
}

.editor-buttons button{
    border:0;
    border-radius:7px;
    padding:11px 3px;
    background:#334155;
    color:white;
    font-weight:bold;
    font-size:11px;
}

.editor-buttons .keep{
    background:#10b981;
}

@media(max-height:650px){
    .editor-message{
        display:none;
    }

    .filter-btn{
        padding:6px 2px;
    }

    .editor-buttons button{
        padding:8px 2px;
    }
}
</style>
</head>

<body>

<h1>Super Converter Pro</h1>
<p class="subtitle">HD Document Studio</p>

<div class="tool-grid">
    <button id="tab-merge" class="tool-card active" onclick="switchTab('merge')">
        Merge PDF
    </button>

    <button id="tab-resize" class="tool-card" onclick="switchTab('resize')">
        Image Resizer
    </button>

    <button id="tab-scan" class="tool-card" onclick="switchTab('scan')">
        Smart Scan
    </button>
</div>


<!-- =====================================================
MERGE PDF
===================================================== -->

<div id="panel-merge" class="panel">

    <div class="drop-zone"
         onclick="document.getElementById('merge-input').click()">

        📂 Tap to select PDF files

        <input
            id="merge-input"
            type="file"
            accept="application/pdf"
            multiple
            hidden
            onchange="handleQueueFiles(this.files,'pdf')">

    </div>

    <div id="merge-queue"></div>

    <button
        id="merge-btn"
        class="primary-btn hidden"
        style="margin-top:12px"
        onclick="executeMerge()">

        Merge & Download PDF

    </button>

</div>


<!-- =====================================================
IMAGE RESIZER
===================================================== -->

<div id="panel-resize" class="panel hidden">

    <div class="options-panel">

        <label>Target Size</label>

        <div style="display:flex;gap:6px">

            <input
                id="resize-size"
                type="number"
                placeholder="e.g. 150">

            <select id="resize-unit">
                <option>KB</option>
                <option>MB</option>
            </select>

        </div>

        <label>Export Format</label>

        <select id="resize-format">
            <option value="image/jpeg">JPG</option>
            <option value="image/png">PNG</option>
        </select>

    </div>

    <div class="drop-zone"
         onclick="document.getElementById('resize-input').click()">

        🖼️ Tap to select Images

        <input
            id="resize-input"
            type="file"
            accept="image/*"
            multiple
            hidden
            onchange="handleQueueFiles(this.files,'image')">

    </div>

    <div id="resize-queue"></div>

    <button
        id="resize-btn"
        class="primary-btn hidden"
        style="margin-top:12px"
        onclick="executeResize()">

        Compress & Download Images

    </button>

</div>


<!-- =====================================================
SMART SCAN
===================================================== -->

<div id="panel-scan" class="panel hidden">

    <div class="camera-box"
         onclick="document.getElementById('camera-input').click()">

        <div class="camera-title">
            📸 Scan Document
        </div>

        <div class="camera-sub">
            Open phone camera and capture document in HD
        </div>

        <input
            id="camera-input"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
            onchange="handleScanFile(this.files[0])">

    </div>


    <button
        style="margin-top:8px;width:100%"
        class="primary-btn"
        onclick="document.getElementById('gallery-input').click()">

        🖼️ Select From Gallery

    </button>

    <input
        id="gallery-input"
        type="file"
        accept="image/*"
        multiple
        hidden
        onchange="handleGallery(this.files)">


    <p style="font-size:12px;color:#94a3b8">
        Scanned Pages
    </p>

    <div id="scanned-grid" class="scanned-grid"></div>


    <!-- ALWAYS VISIBLE WHEN PAGE EXISTS -->

    <div id="save-box" class="save-box hidden">

        <div style="font-size:12px;font-weight:bold;margin-bottom:8px">
            📄 PDF Settings
        </div>

        <div class="pdf-options">

            <select id="pdf-size">
                <option value="original">Original Size</option>
                <option value="a4">A4</option>
                <option value="letter">Letter</option>
            </select>

            <select id="pdf-quality">
                <option value="0.98">Maximum HD</option>
                <option value="0.92">High Quality</option>
                <option value="0.82">Balanced</option>
            </select>

        </div>

        <button
            id="save-pdf-btn"
            class="primary-btn success-btn"
            onclick="saveScannedPDF()">

            💾 SAVE AS PDF

        </button>

    </div>

</div>


<!-- =====================================================
SMART SCAN EDITOR
===================================================== -->

<div id="review-workspace" class="hidden">

    <div class="review-header">

        <div class="editor-title">
            ✨ Smart Scan Editor
        </div>

        <button
            class="cancel-btn"
            onclick="closeEditor()">

            Cancel

        </button>

    </div>


    <div class="editor-area">

        <canvas id="editor-canvas"></canvas>

        <div class="editor-message">
            Drag the blue corners freely
        </div>

    </div>


    <!-- CROP MODE -->

    <div class="mode-bar">

        <button
            id="perspective-mode"
            class="mode-btn active"
            onclick="setCropMode('perspective')">

            🔷 4-Corner Crop

        </button>

        <button
            id="free-mode"
            class="mode-btn"
            onclick="setCropMode('free')">

            ✂️ Free Crop

        </button>

    </div>


    <!-- FILTERS -->

    <div class="filter-bar">

        <button
            class="filter-btn active"
            onclick="setFilter('original',this)">

            Original

        </button>

        <button
            class="filter-btn"
            onclick="setFilter('auto',this)">

            Auto

        </button>

        <button
            class="filter-btn"
            onclick="setFilter('bw',this)">

            B&W

        </button>

        <button
            class="filter-btn"
            onclick="setFilter('gray',this)">

            Gray

        </button>

    </div>


    <div class="editor-buttons">

        <button onclick="rotateImage()">
            🔄 Rotate
        </button>

        <button onclick="autoDetect()">
            🤖 Auto Detect
        </button>

        <button onclick="resetCrop()">
            ↩ Reset
        </button>

        <button
            class="keep"
            style="grid-column:span 3"
            onclick="keepPage()">

            ✅ KEEP PAGE

        </button>

    </div>

</div>


<script>

/* =====================================================
GLOBAL
===================================================== */

let activeTab="merge";
let queue=[];

let scannedPages=[];

let sourceCanvas=null;

let editingIndex=-1;

let cropMode="perspective";

let filterMode="original";

let corners=[
    {x:.03,y:.03},
    {x:.97,y:.03},
    {x:.97,y:.97},
    {x:.03,y:.97}
];

let freeCrop={
    left:.03,
    top:.03,
    right:.97,
    bottom:.97
};

let dragCorner=-1;
let dragFree=false;
let dragStart=null;

const canvas=document.getElementById("editor-canvas");


/* =====================================================
TAB
===================================================== */

function switchTab(tab){

    activeTab=tab;

    ["merge","resize","scan"].forEach(t=>{

        document.getElementById(`tab-${t}`)
            .classList.toggle("active",t===tab);

        document.getElementById(`panel-${t}`)
            .classList.toggle("hidden",t!==tab);

    });

}


/* =====================================================
QUEUE
===================================================== */

function handleQueueFiles(files,type){

    queue=Array.from(files);

    let html="";

    queue.forEach(file=>{

        html+=`
        <div class="file-item">
            <span>${escapeHTML(file.name)}</span>
            <span>${(file.size/1024).toFixed(1)} KB</span>
        </div>`;

    });

    if(type==="pdf"){

        document.getElementById("merge-queue").innerHTML=html;

        document.getElementById("merge-btn")
            .classList.remove("hidden");

    }else{

        document.getElementById("resize-queue").innerHTML=html;

        document.getElementById("resize-btn")
            .classList.remove("hidden");

    }

}


/* =====================================================
MERGE
===================================================== */

async function executeMerge(){

    const btn=document.getElementById("merge-btn");

    btn.disabled=true;
    btn.innerText="Merging...";

    try{

        const pdfDoc=await PDFLib.PDFDocument.create();

        for(const file of queue){

            const bytes=await file.arrayBuffer();

            const src=await PDFLib.PDFDocument.load(bytes);

            const pages=await pdfDoc.copyPages(
                src,
                src.getPageIndices()
            );

            pages.forEach(p=>pdfDoc.addPage(p));

        }

        const output=await pdfDoc.save();

        download(
            new Blob([output],{type:"application/pdf"}),
            "Merged_Document.pdf"
        );

        alert("PDF merged successfully!");

    }catch(error){

        alert(error.message);

    }

    btn.disabled=false;
    btn.innerText="Merge & Download PDF";

    queue=[];

    document.getElementById("merge-queue").innerHTML="";

    btn.classList.add("hidden");

}


/* =====================================================
RESIZER
===================================================== */

async function executeResize(){

    const btn=document.getElementById("resize-btn");

    btn.disabled=true;
    btn.innerText="Processing...";

    const size=parseFloat(
        document.getElementById("resize-size").value
    );

    const unit=document.getElementById("resize-unit").value;

    const format=document.getElementById("resize-format").value;

    const targetKB=
        unit==="MB"
        ?size*1024
        :size;

    for(const file of queue){

        const img=await loadImageFromFile(file);

        const c=document.createElement("canvas");

        c.width=img.naturalWidth;
        c.height=img.naturalHeight;

        c.getContext("2d").drawImage(img,0,0);

        if(targetKB && format==="image/jpeg"){

            await new Promise(resolve=>{

                compressImage(
                    c,
                    targetKB,
                    file.name,
                    resolve
                );

            });

        }else{

            const blob=await canvasBlob(
                c,
                format,
                .9
            );

            download(
                blob,
                file.name.replace(/\.[^/.]+/,"")+
                (format==="image/png"?".png":".jpg")
            );

        }

    }

    alert("Images processed!");

    queue=[];

    document.getElementById("resize-queue").innerHTML="";

    btn.classList.add("hidden");

    btn.disabled=false;

    btn.innerText="Compress & Download Images";

}


function compressImage(canvas,targetKB,name,done){

    const target=targetKB*1024;

    let low=.05;
    let high=1;
    let q=.7;

    let best=null;
    let bestDiff=Infinity;
    let count=0;

    function test(){

        canvas.toBlob(blob=>{

            count++;

            if(!blob){

                done();
                return;

            }

            const diff=Math.abs(blob.size-target);

            if(diff<bestDiff){

                bestDiff=diff;
                best=blob;

            }

            if(count>=12 || diff<2048){

                download(
                    best,
                    name.replace(/\.[^/.]+/,"")+".jpg"
                );

                done();
                return;

            }

            if(blob.size>target)
                high=q;
            else
                low=q;

            q=(low+high)/2;

            test();

        },"image/jpeg",q);

    }

    test();

}


/* =====================================================
OPEN SCAN
===================================================== */

function handleScanFile(file){

    if(!file)return;

    openScanner(file);

}


function handleGallery(files){

    if(!files.length)return;

    openScanner(files[0]);

}


function openScanner(file){

    const reader=new FileReader();

    reader.onload=e=>{

        const img=new Image();

        img.onload=()=>{

            const max=3000;

            let w=img.naturalWidth;
            let h=img.naturalHeight;

            const scale=Math.min(
                1,
                max/Math.max(w,h)
            );

            sourceCanvas=document.createElement("canvas");

            sourceCanvas.width=Math.round(w*scale);
            sourceCanvas.height=Math.round(h*scale);

            sourceCanvas
                .getContext("2d")
                .drawImage(
                    img,
                    0,
                    0,
                    sourceCanvas.width,
                    sourceCanvas.height
                );

            editingIndex=-1;

            filterMode="original";

            resetCrop();

            document.getElementById("review-workspace")
                .classList.remove("hidden");

            autoDetect();

            drawEditor();

        };

        img.src=e.target.result;

    };

    reader.readAsDataURL(file);

}


/* =====================================================
RESET
===================================================== */

function resetCrop(){

    corners=[
        {x:.03,y:.03},
        {x:.97,y:.03},
        {x:.97,y:.97},
        {x:.03,y:.97}
    ];

    freeCrop={
        left:.03,
        top:.03,
        right:.97,
        bottom:.97
    };

    drawEditor();

}


/* =====================================================
CROP MODE
===================================================== */

function setCropMode(mode){

    cropMode=mode;

    document.getElementById("perspective-mode")
        .classList.toggle(
            "active",
            mode==="perspective"
        );

    document.getElementById("free-mode")
        .classList.toggle(
            "active",
            mode==="free"
        );

    drawEditor();

}


/* =====================================================
DRAW EDITOR
===================================================== */

function drawEditor(){

    if(!sourceCanvas)return;

    const maxW=window.innerWidth-16;
    const maxH=window.innerHeight*.58;

    const scale=Math.min(
        maxW/sourceCanvas.width,
        maxH/sourceCanvas.height
    );

    canvas.width=Math.max(
        1,
        Math.round(sourceCanvas.width*scale)
    );

    canvas.height=Math.max(
        1,
        Math.round(sourceCanvas.height*scale)
    );

    const ctx=canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.drawImage(
        sourceCanvas,
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(cropMode==="perspective"){

        drawPerspectiveOverlay(ctx);

    }else{

        drawFreeOverlay(ctx);

    }

}


/* =====================================================
PERSPECTIVE OVERLAY
===================================================== */

function drawPerspectiveOverlay(ctx){

    const p=corners.map(c=>({
        x:c.x*canvas.width,
        y:c.y*canvas.height
    }));

    ctx.fillStyle="rgba(0,0,0,.52)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(p[0].x,p[0].y);

    p.slice(1).forEach(point=>{
        ctx.lineTo(point.x,point.y);
    });

    ctx.closePath();

    ctx.clip();

    ctx.drawImage(
        sourceCanvas,
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.restore();

    ctx.strokeStyle="#6366f1";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(p[0].x,p[0].y);

    p.slice(1).forEach(point=>{
        ctx.lineTo(point.x,point.y);
    });

    ctx.closePath();

    ctx.stroke();

    p.forEach(point=>{

        ctx.beginPath();

        ctx.arc(
            point.x,
            point.y,
            12,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#6366f1";
        ctx.fill();

        ctx.strokeStyle="#fff";
        ctx.lineWidth=2;
        ctx.stroke();

    });

}


/* =====================================================
FREE CROP
===================================================== */

function drawFreeOverlay(ctx){

    const x=freeCrop.left*canvas.width;
    const y=freeCrop.top*canvas.height;

    const w=
        (freeCrop.right-freeCrop.left)*
        canvas.width;

    const h=
        (freeCrop.bottom-freeCrop.top)*
        canvas.height;

    ctx.fillStyle="rgba(0,0,0,.52)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.clearRect(
        x,
        y,
        w,
        h
    );

    ctx.drawImage(
        sourceCanvas,
        x,
        y,
        w,
        h,
        x,
        y,
        w,
        h
    );

    ctx.strokeStyle="#6366f1";
    ctx.lineWidth=3;

    ctx.strokeRect(x,y,w,h);

    [
        [x,y],
        [x+w,y],
        [x+w,y+h],
        [x,y+h]
    ].forEach(p=>{

        ctx.beginPath();

        ctx.arc(
            p[0],
            p[1],
            12,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#6366f1";
        ctx.fill();

        ctx.strokeStyle="white";
        ctx.stroke();

    });

}


/* =====================================================
POINTER
===================================================== */

function pointer(e){

    const r=canvas.getBoundingClientRect();

    return {
        x:Math.max(
            0,
            Math.min(
                1,
                (e.clientX-r.left)/r.width
            )
        ),

        y:Math.max(
            0,
            Math.min(
                1,
                (e.clientY-r.top)/r.height
            )
        )
    };

}


canvas.addEventListener("pointerdown",e=>{

    const p=pointer(e);

    if(cropMode==="perspective"){

        let nearest=-1;
        let distance=.07;

        corners.forEach((c,i)=>{

            const d=Math.hypot(
                c.x-p.x,
                c.y-p.y
            );

            if(d<distance){

                nearest=i;
                distance=d;

            }

        });

        dragCorner=nearest;

    }else{

        const left=freeCrop.left;
        const right=freeCrop.right;
        const top=freeCrop.top;
        const bottom=freeCrop.bottom;

        const nearLeft=Math.abs(p.x-left)<.07;
        const nearRight=Math.abs(p.x-right)<.07;
        const nearTop=Math.abs(p.y-top)<.07;
        const nearBottom=Math.abs(p.y-bottom)<.07;

        if(nearLeft && nearTop)
            dragCorner=0;

        else if(nearRight && nearTop)
            dragCorner=1;

        else if(nearRight && nearBottom)
            dragCorner=2;

        else if(nearLeft && nearBottom)
            dragCorner=3;

        else if(
            p.x>left &&
            p.x<right &&
            p.y>top &&
            p.y<bottom
        ){

            dragFree=true;

            dragStart={
                x:p.x,
                y:p.y,
                left,
                right,
                top,
                bottom
            };

        }

    }

    canvas.setPointerCapture(e.pointerId);

});


canvas.addEventListener("pointermove",e=>{

    const p=pointer(e);

    if(cropMode==="perspective"){

        if(dragCorner<0)return;

        corners[dragCorner].x=p.x;
        corners[dragCorner].y=p.y;

    }else{

        if(dragCorner>=0){

            if(dragCorner===0){

                freeCrop.left=Math.min(
                    p.x,
                    freeCrop.right-.02
                );

                freeCrop.top=Math.min(
                    p.y,
                    freeCrop.bottom-.02
                );

            }

            if(dragCorner===1){

                freeCrop.right=Math.max(
                    p.x,
                    freeCrop.left+.02
                );

                freeCrop.top=Math.min(
                    p.y,
                    freeCrop.bottom-.02
                );

            }

            if(dragCorner===2){

                freeCrop.right=Math.max(
                    p.x,
                    freeCrop.left+.02
                );

                freeCrop.bottom=Math.max(
                    p.y,
                    freeCrop.top+.02
                );

            }

            if(dragCorner===3){

                freeCrop.left=Math.min(
                    p.x,
                    freeCrop.right-.02
                );

                freeCrop.bottom=Math.max(
                    p.y,
                    freeCrop.top+.02
                );

            }

        }

        if(dragFree && dragStart){

            const dx=p.x-dragStart.x;
            const dy=p.y-dragStart.y;

            let width=
                dragStart.right-dragStart.left;

            let height=
                dragStart.bottom-dragStart.top;

            let left=dragStart.left+dx;
            let top=dragStart.top+dy;

            left=Math.max(
                0,
                Math.min(1-width,left)
            );

            top=Math.max(
                0,
                Math.min(1-height,top)
            );

            freeCrop.left=left;
            freeCrop.right=left+width;

            freeCrop.top=top;
            freeCrop.bottom=top+height;

        }

    }

    drawEditor();

});


canvas.addEventListener("pointerup",e=>{

    dragCorner=-1;
    dragFree=false;
    dragStart=null;

    try{
        canvas.releasePointerCapture(e.pointerId);
    }catch{}

});


/* =====================================================
FILTER
===================================================== */

function setFilter(mode,button){

    filterMode=mode;

    document.querySelectorAll(".filter-btn")
        .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    drawEditor();

}


/* =====================================================
FILTER PROCESSING
===================================================== */

function applyFilter(c){

    if(filterMode==="original")return;

    const ctx=c.getContext("2d");

    const data=ctx.getImageData(
        0,
        0,
        c.width,
        c.height
    );

    const d=data.data;

    for(let i=0;i<d.length;i+=4){

        const r=d[i];
        const g=d[i+1];
        const b=d[i+2];

        let gray=
            .299*r+
            .587*g+
            .114*b;

        if(filterMode==="gray"){

            d[i]=gray;
            d[i+1]=gray;
            d[i+2]=gray;

        }

        if(filterMode==="bw"){

            /*
            Adaptive-ish document threshold
            */

            let value=
                gray>155
                ?255
                :Math.max(0,gray*.35);

            d[i]=value;
            d[i+1]=value;
            d[i+2]=value;

        }

        if(filterMode==="auto"){

            /*
            Contrast + brightness
            */

            let value=
                (gray-128)*1.35+128;

            value=Math.max(
                0,
                Math.min(255,value)
            );

            d[i]=value;
            d[i+1]=value;
            d[i+2]=value;

        }

    }

    ctx.putImageData(data,0,0);

}


/* =====================================================
FINAL CROP
===================================================== */

function createFinalCrop(){

    const src=sourceCanvas;

    if(cropMode==="free"){

        const x=Math.round(
            freeCrop.left*src.width
        );

        const y=Math.round(
            freeCrop.top*src.height
        );

        const w=Math.round(
            (freeCrop.right-freeCrop.left)*
            src.width
        );

        const h=Math.round(
            (freeCrop.bottom-freeCrop.top)*
            src.height
        );

        const out=document.createElement("canvas");

        out.width=Math.max(1,w);
        out.height=Math.max(1,h);

        out.getContext("2d").drawImage(
            src,
            x,
            y,
            w,
            h,
            0,
            0,
            w,
            h
        );

        applyFilter(out);

        return out;

    }


    /* 4 CORNER */

    const p=corners.map(c=>({
        x:c.x*src.width,
        y:c.y*src.height
    }));

    const tl=p[0];
    const tr=p[1];
    const br=p[2];
    const bl=p[3];

    const width=Math.max(
        Math.hypot(tr.x-tl.x,tr.y-tl.y),
        Math.hypot(br.x-bl.x,br.y-bl.y)
    );

    const height=Math.max(
        Math.hypot(bl.x-tl.x,bl.y-tl.y),
        Math.hypot(br.x-tr.x,br.y-tr.y)
    );

    const outW=Math.round(width);
    const outH=Math.round(height);


    /* OpenCV perspective */

    if(
        typeof cv!=="undefined" &&
        cv.Mat
    ){

        try{

            const srcMat=cv.imread(src);

            const dstMat=new cv.Mat();

            const srcPts=cv.matFromArray(
                4,
                1,
                cv.CV_32FC2,
                [
                    tl.x,tl.y,
                    tr.x,tr.y,
                    br.x,br.y,
                    bl.x,bl.y
                ]
            );

            const dstPts=cv.matFromArray(
                4,
                1,
                cv.CV_32FC2,
                [
                    0,0,
                    outW,0,
                    outW,outH,
                    0,outH
                ]
            );

            const matrix=
                cv.getPerspectiveTransform(
                    srcPts,
                    dstPts
                );

            cv.warpPerspective(
                srcMat,
                dstMat,
                matrix,
                new cv.Size(outW,outH),
                cv.INTER_LINEAR,
                cv.BORDER_REPLICATE,
                new cv.Scalar()
            );

            const out=document.createElement("canvas");

            out.width=outW;
            out.height=outH;

            cv.imshow(out,dstMat);

            applyFilter(out);

            srcMat.delete();
            dstMat.delete();
            srcPts.delete();
            dstPts.delete();
            matrix.delete();

            return out;

        }catch(error){

            console.log(error);

        }

    }


    /* fallback */

    const out=document.createElement("canvas");

    out.width=outW;
    out.height=outH;

    out.getContext("2d").drawImage(
        src,
        Math.min(tl.x,bl.x),
        Math.min(tl.y,tr.y),
        Math.max(tr.x,br.x)-Math.min(tl.x,bl.x),
        Math.max(bl.y,br.y)-Math.min(tl.y,tr.y),
        0,
        0,
        outW,
        outH
    );

    applyFilter(out);

    return out;

}


/* =====================================================
KEEP PAGE
===================================================== */

function keepPage(){

    if(!sourceCanvas)return;

    const finalCanvas=createFinalCrop();

    const url=finalCanvas.toDataURL(
        "image/jpeg",
        .97
    );

    if(editingIndex>=0){

        scannedPages[editingIndex]=url;

    }else{

        scannedPages.push(url);

    }

    closeEditor();

    renderPages();

}


/* =====================================================
EDIT EXISTING
===================================================== */

function editPage(index){

    const img=new Image();

    img.onload=()=>{

        sourceCanvas=document.createElement("canvas");

        sourceCanvas.width=img.naturalWidth;
        sourceCanvas.height=img.naturalHeight;

        sourceCanvas
            .getContext("2d")
            .drawImage(img,0,0);

        editingIndex=index;

        filterMode="original";

        cropMode="perspective";

        resetCrop();

        document.getElementById("review-workspace")
            .classList.remove("hidden");

        drawEditor();

    };

    img.src=scannedPages[index];

}


/* =====================================================
AUTO DETECT
===================================================== */

function autoDetect(){

    if(!sourceCanvas){

        drawEditor();
        return;

    }

    /*
    Reset first
    */

    resetCrop();

    /*
    OpenCV may still be loading.
    */

    if(
        typeof cv==="undefined" ||
        !cv.Mat
    ){

        drawEditor();

        return;

    }

    try{

        const src=cv.imread(sourceCanvas);

        const gray=new cv.Mat();

        cv.cvtColor(
            src,
            gray,
            cv.COLOR_RGBA2GRAY
        );

        const blur=new cv.Mat();

        cv.GaussianBlur(
            gray,
            blur,
            new cv.Size(5,5),
            0
        );

        const edges=new cv.Mat();

        cv.Canny(
            blur,
            edges,
            50,
            150
        );

        const contours=new cv.MatVector();

        const hierarchy=new cv.Mat();

        cv.findContours(
            edges,
            contours,
            hierarchy,
            cv.RETR_LIST,
            cv.CHAIN_APPROX_SIMPLE
        );

        let best=null;
        let bestArea=0;

        for(let i=0;i<contours.size();i++){

            const contour=contours.get(i);

            const area=cv.contourArea(contour);

            if(area>bestArea){

                const perimeter=
                    cv.arcLength(
                        contour,
                        true
                    );

                const approx=new cv.Mat();

                cv.approxPolyDP(
                    contour,
                    approx,
                    .02*perimeter,
                    true
                );

                if(
                    approx.rows===4 &&
                    area>
                    sourceCanvas.width*
                    sourceCanvas.height*
                    .15
                ){

                    if(best)best.delete();

                    best=approx;
                    bestArea=area;

                }else{

                    approx.delete();

                }

            }

            contour.delete();

        }

        if(best){

            let points=[];

            for(let i=0;i<4;i++){

                points.push({
                    x:best.intAt(i,0),
                    y:best.intAt(i,1)
                });

            }

            points=orderPoints(points);

            corners=points.map(p=>({

                x:p.x/sourceCanvas.width,
                y:p.y/sourceCanvas.height

            }));

            best.delete();

        }

        src.delete();
        gray.delete();
        blur.delete();
        edges.delete();
        contours.delete();
        hierarchy.delete();

    }catch(error){

        console.log(
            "Auto detect error:",
            error
        );

    }

    drawEditor();

}


/* =====================================================
POINT ORDER
===================================================== */

function orderPoints(points){

    const sum=p=>p.x+p.y;
    const diff=p=>p.x-p.y;

    const tl=points.reduce(
        (a,b)=>sum(a)<sum(b)?a:b
    );

    const br=points.reduce(
        (a,b)=>sum(a)>sum(b)?a:b
    );

    const tr=points.reduce(
        (a,b)=>diff(a)>diff(b)?a:b
    );

    const bl=points.reduce(
        (a,b)=>diff(a)<diff(b)?a:b
    );

    return[tl,tr,br,bl];

}


/* =====================================================
ROTATE
===================================================== */

function rotateImage(){

    if(!sourceCanvas)return;

    const old=sourceCanvas;

    const out=document.createElement("canvas");

    out.width=old.height;
    out.height=old.width;

    const ctx=out.getContext("2d");

    ctx.translate(
        out.width/2,
        out.height/2
    );

    ctx.rotate(Math.PI/2);

    ctx.drawImage(
        old,
        -old.width/2,
        -old.height/2
    );

    sourceCanvas=out;

    resetCrop();

}


/* =====================================================
CLOSE
===================================================== */

function closeEditor(){

    sourceCanvas=null;
    editingIndex=-1;

    document.getElementById("review-workspace")
        .classList.add("hidden");

}


/* =====================================================
RENDER PAGES
===================================================== */

function renderPages(){

    const grid=
        document.getElementById("scanned-grid");

    grid.innerHTML="";

    scannedPages.forEach((url,index)=>{

        grid.innerHTML+=`

        <div class="grid-thumb">

            <img
                src="${url}"
                onclick="editPage(${index})">

            <div class="page-number">
                Page ${index+1}
            </div>

            <button
                class="delete-page"
                onclick="event.stopPropagation();deletePage(${index})">

                ×

            </button>

        </div>`;

    });

    document.getElementById("save-box")
        .classList.toggle(
            "hidden",
            scannedPages.length===0
        );

}


function deletePage(index){

    scannedPages.splice(index,1);

    renderPages();

}


/* =====================================================
SAVE PDF
===================================================== */

async function saveScannedPDF(){

    if(!scannedPages.length){

        alert("Please scan at least one page.");

        return;

    }

    const filename=prompt(
        "Enter PDF file name:",
        "HD_Scanned_Document"
    );

    if(!filename)return;

    const btn=
        document.getElementById("save-pdf-btn");

    btn.disabled=true;
    btn.innerText="Creating PDF... ⏳";

    try{

        const pdf=
            await PDFLib.PDFDocument.create();

        const pageSize=
            document.getElementById("pdf-size").value;

        const quality=
            parseFloat(
                document.getElementById("pdf-quality").value
            );

        for(const url of scannedPages){

            const img=
                await loadImage(url);

            const c=
                document.createElement("canvas");

            c.width=img.naturalWidth;
            c.height=img.naturalHeight;

            c.getContext("2d")
                .drawImage(img,0,0);

            const blob=
                await canvasBlob(
                    c,
                    "image/jpeg",
                    quality
                );

            const bytes=
                await blob.arrayBuffer();

            const embedded=
                await pdf.embedJpg(bytes);

            let width=embedded.width;
            let height=embedded.height;

            if(pageSize==="a4"){

                const A4W=595;
                const A4H=842;

                const scale=Math.min(
                    A4W/width,
                    A4H/height
                );

                width*=scale;
                height*=scale;

                const page=
                    pdf.addPage([A4W,A4H]);

                page.drawImage(
                    embedded,
                    {
                        x:(A4W-width)/2,
                        y:(A4H-height)/2,
                        width,
                        height
                    }
                );

                continue;

            }

            if(pageSize==="letter"){

                const W=612;
                const H=792;

                const scale=Math.min(
                    W/width,
                    H/height
                );

                width*=scale;
                height*=scale;

                const page=
                    pdf.addPage([W,H]);

                page.drawImage(
                    embedded,
                    {
                        x:(W-width)/2,
                        y:(H-height)/2,
                        width,
                        height
                    }
                );

                continue;

            }

            const page=
                pdf.addPage([
                    width,
                    height
                ]);

            page.drawImage(
                embedded,
                {
                    x:0,
                    y:0,
                    width,
                    height
                }
            );

        }

        const bytes=await pdf.save();

        download(
            new Blob(
                [bytes],
                {type:"application/pdf"}
            ),
            filename+".pdf"
        );

        alert("PDF saved successfully!");

    }catch(error){

        alert(
            "PDF Error: "+
            error.message
        );

    }

    btn.disabled=false;
    btn.innerText="💾 SAVE AS PDF";

}


/* =====================================================
HELPERS
===================================================== */

function loadImageFromFile(file){

    return new Promise((resolve,reject)=>{

        const reader=new FileReader();

        reader.onload=e=>{

            const img=new Image();

            img.onload=()=>resolve(img);

            img.onerror=reject;

            img.src=e.target.result;

        };

        reader.onerror=reject;

        reader.readAsDataURL(file);

    });

}


function loadImage(url){

    return new Promise((resolve,reject)=>{

        const img=new Image();

        img.onload=()=>resolve(img);

        img.onerror=reject;

        img.src=url;

    });

}


function canvasBlob(canvas,type,quality){

    return new Promise(resolve=>{

        canvas.toBlob(
            resolve,
            type,
            quality
        );

    });

}


function download(blob,name){

    const a=document.createElement("a");

    const url=
        URL.createObjectURL(blob);

    a.href=url;
    a.download=name;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        ()=>URL.revokeObjectURL(url),
        1000
    );

}


function escapeHTML(text){

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
