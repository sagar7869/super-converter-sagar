<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Converter Pro</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f3f4f6; margin: 0; padding: 20px; text-align: center; }
        .tool-grid { display: flex; justify-content: center; gap: 15px; margin: 30px 0; flex-wrap: wrap; }
        .tool-card { background: white; border: 2px solid #e5e7eb; padding: 15px 25px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .tool-card.active { border-color: #4F46E5; color: #4F46E5; }
        .drop-zone { max-width: 600px; margin: 0 auto; padding: 40px; border: 2px dashed #9ca3af; border-radius: 12px; background: white; cursor: pointer; }
        .hidden { display: none !important; }
        .options-panel { margin: 20px auto; max-width: 600px; display: flex; flex-wrap: wrap; gap: 10px; background: white; padding: 15px; border-radius: 8px; }
        .options-panel input, .options-panel select { flex: 1; min-width: 120px; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; }
        .file-list { max-width: 600px; margin: 20px auto; text-align: left; }
        .file-item { background: white; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .primary-btn { background: #4F46E5; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        .primary-btn:disabled { background: #9ca3af; cursor: not-allowed; }
        
        /* ADOBE STYLE SCANNER UI */
        #scanner-ui { max-width: 600px; margin: 0 auto; background: #1f2937; padding: 15px; border-radius: 12px; position: relative; }
        .camera-container { position: relative; width: 100%; border-radius: 8px; overflow: hidden; background: #000; }
        #camera-feed { width: 100%; max-height: 500px; object-fit: cover; display: block; }
        #flash-btn { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); color: white; border: 1px solid white; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 14px; z-index: 10; }
        
        /* Capture Button Layout */
        .camera-controls { display: flex; justify-content: center; padding: 20px 0; }
        .capture-btn { width: 70px; height: 70px; border-radius: 50%; background: white; border: 4px solid #9ca3af; cursor: pointer; transition: 0.2s; }
        .capture-btn:active { transform: scale(0.9); background: #e5e7eb; }

        /* Review Screen Overlay */
        #review-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1f2937; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 15px; }
        #review-image { max-width: 100%; max-height: 70%; object-fit: contain; border-radius: 8px; }
        .review-toolbar { display: flex; gap: 10px; width: 100%; justify-content: space-around; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; }
        .icon-btn { background: none; border: none; color: white; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .icon-btn span { font-size: 20px; }

        /* Thumbnails List */
        .preview-thumbnails { display: flex; gap: 10px; overflow-x: auto; margin-top: 15px; padding-bottom: 10px; }
        .thumb-wrap { position: relative; flex-shrink: 0; }
        .thumb-wrap img { height: 90px; width: 70px; object-fit: cover; border-radius: 4px; border: 2px solid #4F46E5; }
        .delete-thumb { position: absolute; top: -5px; right: -5px; background: red; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; }
        .success-btn { background: #10b981; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>Super Converter Pro</h1>
    <p>All-in-One Local Processor</p>

    <div class="tool-grid">
        <button class="tool-card active" id="btn-merge" onclick="switchTool('merge')">Merge PDF</button>
        <button class="tool-card" id="btn-resize" onclick="switchTool('resize')">Image Resizer</button>
        <button class="tool-card" id="btn-scan" onclick="switchTool('scan')">Smart Scanner</button>
    </div>

    <div id="resize-options" class="options-panel hidden">
        <input type="number" id="inp-w" placeholder="Width (px)">
        <input type="number" id="inp-h" placeholder="Height (px)">
        <input type="number" id="inp-size" placeholder="Target Size">
        <select id="inp-unit"><option value="KB">KB</option><option value="MB">MB</option></select>
        <select id="inp-fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select>
    </div>

    <div id="drop-zone-area" class="drop-zone" onclick="document.getElementById('file-input').click()">
        <p>Click here to Browse Files</p>
        <input type="file" id="file-input" multiple hidden onchange="handleFiles(this.files)">
    </div>

    <div id="staging-area" class="file-list hidden">
        <div id="file-display"></div>
        <button id="action-btn" class="primary-btn" onclick="processQueue()">Process Files</button>
    </div>

    <!-- SCANNER MODULE -->
    <div id="scanner-ui" class="hidden">
        <div class="camera-container" id="camera-view">
            <button id="flash-btn" onclick="toggleFlash()">⚡ Flash OFF</button>
            <video id="camera-feed" autoplay playsinline></video>
            
            <div class="camera-controls">
                <button class="capture-btn" onclick="capturePage()"></button>
            </div>
        </div>

        <!-- ADOBE STYLE REVIEW SCREEN -->
        <div id="review-screen" class="hidden">
            <img id="review-image" src="" alt="Captured Frame">
            <div class="review-toolbar">
                <button class="icon-btn" onclick="retakePhoto()"><span>✖️</span> Retake</button>
                <button class="icon-btn" onclick="rotatePhoto()"><span>🔃</span> Rotate</button>
                <button class="icon-btn" onclick="applyScanFilter()"><span>🪄</span> Filter</button>
                <button class="icon-btn" onclick="keepPhoto()"><span>✅</span> Keep</button>
            </div>
        </div>
        
        <div id="scanned-preview-list" class="preview-thumbnails"></div>
        <button id="btn-save-scan" class="primary-btn success-btn hidden" onclick="finishScan()">Save PDF & Close Camera</button>
        <canvas id="hidden-canvas" hidden></canvas>
    </div>

    <script>
        // --- 1. GLOBAL STATE ---
        let currentTool = 'merge';
        let fileQueue = [];
        
        let videoStream = null;
        let imageTrack = null;
        let isFlashOn = false;
        let scannedPages = [];
        let tempCurrentPhoto = null; // Temp storage for review screen

        // --- 2. MAIN UI LOGIC ---
        function switchTool(tool) {
            currentTool = tool;
            fileQueue = [];
            document.getElementById('staging-area').classList.add('hidden');
            
            document.getElementById('btn-merge').classList.toggle('active', tool === 'merge');
            document.getElementById('btn-resize').classList.toggle('active', tool === 'resize');
            document.getElementById('btn-scan').classList.toggle('active', tool === 'scan');
            document.getElementById('resize-options').classList.toggle('hidden', tool !== 'resize');

            if (tool === 'scan') {
                document.getElementById('drop-zone-area').classList.add('hidden');
                document.getElementById('scanner-ui').classList.remove('hidden');
                startCamera();
            } else {
                document.getElementById('drop-zone-area').classList.remove('hidden');
                document.getElementById('scanner-ui').classList.add('hidden');
                stopCamera();
            }
        }

        function handleFiles(files) {
            if (files.length === 0) return;
            fileQueue = Array.from(files);
            let html = '';
            fileQueue.forEach(f => html += `<div class="file-item"><span>📄 ${f.name}</span><span>${(f.size/1024).toFixed(1)} KB</span></div>`);
            document.getElementById('file-display').innerHTML = html;
            document.getElementById('staging-area').classList.remove('hidden');
            document.getElementById('action-btn').innerText = currentTool === 'merge' ? 'Merge PDFs' : 'Compress Images';
        }

        async function processQueue() {
            const btn = document.getElementById('action-btn');
            btn.innerText = "Processing... Please wait ⏳";
            btn.disabled = true;

            try {
                if (currentTool === 'merge') await runPdfMerge(fileQueue);
                else await runImageResizer(fileQueue);
                alert("Task Complete! File(s) downloaded.");
            } catch (err) { alert("Error: " + err.message); }

            btn.disabled = false;
            fileQueue = [];
            document.getElementById('staging-area').classList.add('hidden');
        }

        async function runPdfMerge(files) {
            const { PDFDocument } = window.PDFLib;
            const mergedPdf = await PDFDocument.create();
            for (let file of files) {
                const arrBuffer = await file.arrayBuffer();
                const pdf = await PDFDocument.load(arrBuffer);
                const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                pages.forEach(p => mergedPdf.addPage(p));
            }
            triggerDownload(new Blob([await mergedPdf.save()], { type: 'application/pdf' }), 'Merged_Output.pdf');
        }

        async function runImageResizer(files) {
            const sizeVal = document.getElementById('inp-size').value;
            const unit = document.getElementById('inp-unit').value;
            const targetKB = (sizeVal && unit === 'MB') ? sizeVal * 1024 : sizeVal;
            const options = { w: document.getElementById('inp-w').value, h: document.getElementById('inp-h').value, kb: targetKB, fmt: document.getElementById('inp-fmt').value };

            for (let file of files) if (file.type.startsWith('image/')) await processSingleImage(file, options);
        }

        function processSingleImage(file, opt) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        let finalW = opt.w ? parseInt(opt.w) : img.width;
                        let finalH = opt.h ? parseInt(opt.h) : img.height;
                        if (opt.w && !opt.h) finalH = (img.height / img.width) * finalW;
                        if (opt.h && !opt.w) finalW = (img.width / img.height) * finalH;
                        
                        if (opt.kb && opt.fmt === 'image/jpeg') smartCompress(img, finalW, finalH, opt.kb, file.name, resolve);
                        else {
                            const canvas = document.createElement('canvas');
                            canvas.width = finalW; canvas.height = finalH;
                            canvas.getContext('2d').drawImage(img, 0, 0, finalW, finalH);
                            canvas.toBlob(blob => { triggerDownload(blob, file.name.replace(/\.[^/.]+$/, "") + (opt.fmt==='image/png'?'.png':'.jpg')); resolve(); }, opt.fmt, 0.9);
                        }
                    };
                    img.onerror = () => resolve(); img.src = e.target.result;
                };
                reader.onerror = () => resolve(); reader.readAsDataURL(file);
            });
        }

        function smartCompress(img, w, h, targetKB, name, callback) {
            const targetBytes = targetKB * 1024; let scale = 1.0; let bestBlob = null; let closest = Infinity;
            function tryScale() {
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(w * scale, 50); canvas.height = Math.max(h * scale, 50);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);

                let minQ = 0.1, maxQ = 1.0, curQ = 0.7, attempts = 0;
                function tryQuality() {
                    canvas.toBlob(blob => {
                        if (!blob) return callback();
                        attempts++; const diff = Math.abs(blob.size - targetBytes);
                        if (diff < closest) { closest = diff; bestBlob = blob; }
                        
                        if (diff <= 3072 || attempts >= 8) {
                            if (blob.size > targetBytes + 1024 && curQ <= 0.3 && scale > 0.2) { scale -= 0.15; tryScale(); } 
                            else { triggerDownload(bestBlob, name.replace(/\.[^/.]+$/, "") + ".jpg"); callback(); }
                            return;
                        }
                        if (blob.size > targetBytes) maxQ = curQ; else minQ = curQ;
                        curQ = (minQ + maxQ) / 2; tryQuality();
                    }, 'image/jpeg', curQ);
                }
                tryQuality();
            }
            tryScale();
        }

        function triggerDownload(blob, filename) {
            if (!blob) return;
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob);
            link.download = filename; document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        // --- 4. ADVANCED SCANNER MODULE ---
        
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const video = document.getElementById('camera-feed');
                video.srcObject = stream;
                videoStream = stream;
                imageTrack = stream.getVideoTracks()[0];
                
                // Check if Flash (Torch) is supported
                const capabilities = imageTrack.getCapabilities();
                if (!capabilities.torch) {
                    document.getElementById('flash-btn').style.display = 'none';
                } else {
                    document.getElementById('flash-btn').style.display = 'block';
                }
            } catch (err) { alert("Camera start fail: " + err.message); }
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => {
                    track.stop(); // Stops hardware camera
                });
                videoStream = null;
                document.getElementById('camera-feed').srcObject = null;
            }
            if (isFlashOn) toggleFlash(); // Turn off flash safely
        }

        async function toggleFlash() {
            if (!imageTrack) return;
            isFlashOn = !isFlashOn;
            try {
                await imageTrack.applyConstraints({ advanced: [{ torch: isFlashOn }] });
                document.getElementById('flash-btn').innerText = isFlashOn ? "⚡ Flash ON" : "⚡ Flash OFF";
                document.getElementById('flash-btn').style.color = isFlashOn ? "#facc15" : "white";
            } catch (e) { alert("Flash feature is not supported on this device's browser."); }
        }

        // Click photo & show Review Screen
        function capturePage() {
            const video = document.getElementById('camera-feed');
            const canvas = document.getElementById('hidden-canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            tempCurrentPhoto = canvas.toDataURL('image/jpeg', 0.9);
            
            document.getElementById('review-image').src = tempCurrentPhoto;
            document.getElementById('camera-view').classList.add('hidden');
            document.getElementById('review-screen').classList.remove('hidden');
        }

        // Review Action: Retake
        function retakePhoto() {
            tempCurrentPhoto = null;
            document.getElementById('review-screen').classList.add('hidden');
            document.getElementById('camera-view').classList.remove('hidden');
        }

        // Review Action: Keep
        function keepPhoto() {
            scannedPages.push(tempCurrentPhoto);
            tempCurrentPhoto = null;
            document.getElementById('review-screen').classList.add('hidden');
            document.getElementById('camera-view').classList.remove('hidden');
            updateScannerUI();
        }

        // Review Action: Rotate 90 deg
        function rotatePhoto() {
            const img = new Image();
            img.onload = () => {
                const canvas = document.getElementById('hidden-canvas');
                canvas.width = img.height; // Swap W and H
                canvas.height = img.width;
                const ctx = canvas.getContext('2d');
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(90 * Math.PI / 180);
                ctx.drawImage(img, -img.width / 2, -img.height / 2);
                
                tempCurrentPhoto = canvas.toDataURL('image/jpeg', 0.9);
                document.getElementById('review-image').src = tempCurrentPhoto;
            };
            img.src = tempCurrentPhoto;
        }

        // Review Action: Document Filter (High Contrast B&W effect)
        function applyScanFilter() {
            const img = new Image();
            img.onload = () => {
                const canvas = document.getElementById('hidden-canvas');
                canvas.width = img.width; canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                // Apply a CSS filter on canvas drawing
                ctx.filter = 'grayscale(100%) contrast(150%) brightness(120%)';
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                tempCurrentPhoto = canvas.toDataURL('image/jpeg', 0.9);
                document.getElementById('review-image').src = tempCurrentPhoto;
            };
            img.src = tempCurrentPhoto;
        }

        // Thumbnails UI and Delete
        function updateScannerUI() {
            const previewContainer = document.getElementById('scanned-preview-list');
            previewContainer.innerHTML = '';
            
            scannedPages.forEach((dataUrl, index) => {
                previewContainer.innerHTML += `
                <div class="thumb-wrap">
                    <img src="${dataUrl}" alt="Page">
                    <button class="delete-thumb" onclick="deletePage(${index})">X</button>
                </div>`;
            });

            if (scannedPages.length > 0) {
                document.getElementById('btn-save-scan').classList.remove('hidden');
            } else {
                document.getElementById('btn-save-scan').classList.add('hidden');
            }
        }

        // Delete specific page from array
        function deletePage(index) {
            scannedPages.splice(index, 1);
            updateScannerUI();
        }

        // Finish and close Camera
        async function finishScan() {
            if (scannedPages.length === 0) return;
            const fileName = prompt("Enter File Name:", "Scanned_Document");
            if (!fileName) return;

            const btn = document.getElementById('btn-save-scan');
            btn.innerText = "Generating PDF... ⏳"; btn.disabled = true;

            try {
                const { PDFDocument } = window.PDFLib;
                const pdfDoc = await PDFDocument.create();

                for (let imgDataUrl of scannedPages) {
                    const imgBytes = await fetch(imgDataUrl).then(res => res.arrayBuffer());
                    const pdfImage = await pdfDoc.embedJpg(imgBytes);
                    const page = pdfDoc.addPage([pdfImage.width, pdfImage.height]);
                    page.drawImage(pdfImage, { x: 0, y: 0, width: pdfImage.width, height: pdfImage.height });
                }

                const blob = new Blob([await pdfDoc.save()], { type: 'application/pdf' });
                triggerDownload(blob, fileName + ".pdf");
                
                // IMPORTANT: Turn off camera after save!
                stopCamera();
                alert("Scan Complete! PDF Downloaded & Camera Turned Off.");
                
            } catch (err) {
                alert("Error generating PDF: " + err.message);
            }

            // Reset UI
            scannedPages = [];
            updateScannerUI();
            btn.classList.add('hidden');
            btn.innerText = "Save PDF & Close Camera";
            btn.disabled = false;
            
            // Switch back to merge screen to clear everything safely
            switchTool('merge');
        }
    </script>
</body>
</html>
