<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Converter Pro - Vision Scanner</title>
    <!-- PDF Library -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- OpenCV.js for Real Document Edge Detection & Perspective Warp -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0f172a; margin: 0; padding: 15px; text-align: center; color: #f8fafc; }
        
        h1 { font-size: 22px; margin-bottom: 2px; color: #f8fafc; }
        p.subtitle { font-size: 13px; color: #94a3b8; margin-top: 0; margin-bottom: 20px; }

        .tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .tool-card { background: #1e293b; border: 1.5px solid #334155; padding: 12px 5px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; color: #94a3b8; }
        .tool-card.active { border-color: #6366f1; background: #312e81; color: #818cf8; }

        .panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
        
        .drop-zone { border: 2px dashed #475569; border-radius: 10px; padding: 30px 20px; cursor: pointer; background: #0f172a; }
        .options-panel { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; text-align: left; }
        .options-panel label { font-size: 12px; font-weight: 600; color: #cbd5e1; }
        .options-panel input, .options-panel select { width: 100%; padding: 10px; border: 1px solid #475569; background: #0f172a; color: white; border-radius: 8px; font-size: 14px; }
        
        .primary-btn { background: #6366f1; color: white; border: none; padding: 14px; font-size: 15px; border-radius: 10px; cursor: pointer; font-weight: 600; width: 100%; box-shadow: 0 4px 6px rgba(99, 102, 241, 0.4); }
        .primary-btn:active { transform: scale(0.98); }
        .success-btn { background: #10b981; }

        .file-item { background: #0f172a; padding: 10px 14px; border: 1px solid #334155; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }

        /* --- VISION CAMERA OVERLAY --- */
        #active-camera-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; display: flex; flex-direction: column; justify-content: space-between; }
        .cam-header { display: flex; justify-content: space-between; padding: 15px 20px; align-items: center; background: rgba(0,0,0,0.8); }
        .cam-header button { background: none; border: none; color: white; font-size: 15px; cursor: pointer; font-weight: 600; }
        
        .cam-viewport { position: relative; flex-grow: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }
        
        .cam-footer { padding: 25px; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.9); gap: 30px; }
        .shutter-btn { width: 72px; height: 72px; border-radius: 50%; background: white; border: 4px solid #6366f1; cursor: pointer; }

        /* REVIEW STUDIO */
        #review-workspace { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f172a; z-index: 110; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .review-box { flex-grow: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 10px 0; }
        #review-img { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 6px; border: 2px solid #334155; }
        
        .review-toolbar { display: flex; justify-content: space-around; background: #1e293b; padding: 12px; border-radius: 12px; gap: 5px; }
        .tool-icon-btn { background: none; border: none; color: #cbd5e1; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tool-icon-btn span { font-size: 18px; }

        .scanned-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; max-height: 350px; overflow-y: auto; padding: 4px; }
        .grid-thumb { position: relative; background: #0f172a; border-radius: 8px; overflow: hidden; aspect-ratio: 3/4; border: 1px solid #334155; }
        .grid-thumb img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        .grid-thumb button { position: absolute; top: 6px; right: 6px; background: rgba(239, 68, 68, 0.9); color: white; border: none; border-radius: 50%; width: 26px; height: 26px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        #opencv-status { font-size: 12px; color: #f59e0b; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Super Converter Pro</h1>
    <p class="subtitle">Vision-Powered Local Document Scanner</p>

    <div class="tool-grid">
        <button class="tool-card active" id="tab-merge" onclick="switchTab('merge')">Merge PDF</button>
        <button class="tool-card" id="tab-resize" onclick="switchTab('resize')">Image Resizer</button>
        <button class="tool-card" id="tab-scan" onclick="switchTab('scan')">Vision Scan</button>
    </div>

    <!-- MERGE PANEL -->
    <div id="panel-merge" class="panel">
        <div class="drop-zone" onclick="document.getElementById('file-input-merge').click()">
            <p style="color:#94a3b8;">📂 Tap to select PDF files</p>
            <input type="file" id="file-input-merge" accept="application/pdf" multiple hidden onchange="handleQueueFiles(this.files, 'pdf')">
        </div>
        <div id="queue-merge" style="margin-top: 15px;"></div>
        <button id="btn-process-merge" class="primary-btn hidden" style="margin-top: 15px;" onclick="executeMerge()">Merge & Download PDF</button>
    </div>

    <!-- RESIZE PANEL -->
    <div id="panel-resize" class="panel hidden">
        <div class="options-panel">
            <label>Target Size Constraint:</label>
            <div style="display: flex; gap: 8px;">
                <input type="number" id="resize-size" placeholder="e.g. 150">
                <select id="resize-unit"><option value="KB">KB</option><option value="MB">MB</option></select>
            </div>
            <label>Export Format:</label>
            <select id="resize-fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select>
        </div>
        <div class="drop-zone" onclick="document.getElementById('file-input-resize').click()">
            <p style="color:#94a3b8;">🖼️ Tap to select Images</p>
            <input type="file" id="file-input-resize" accept="image/*" multiple hidden onchange="handleQueueFiles(this.files, 'image')">
        </div>
        <div id="queue-resize" style="margin-top: 15px;"></div>
        <button id="btn-process-resize" class="primary-btn hidden" style="margin-top: 15px;" onclick="executeResize()">Compress & Download Images</button>
    </div>

    <!-- SCANNER DASHBOARD -->
    <div id="panel-scan" class="panel hidden">
        <div id="opencv-status">⏳ Loading OpenCV Vision Engine...</div>
        <div id="scanner-dashboard">
            <div style="padding: 10px 0;">
                <button id="cam-open-btn" class="primary-btn" onclick="openCameraModal()" disabled style="opacity: 0.5;">📷 Open Vision Scanner</button>
            </div>
            <div id="scanned-pages-grid" class="scanned-grid"></div>
            <button id="btn-save-scans" class="primary-btn success-btn hidden" style="margin-top: 15px;" onclick="generateScannedPDF()">💾 Save as PDF</button>
        </div>
    </div>

    <!-- LIVE CAMERA MODAL -->
    <div id="active-camera-overlay" class="hidden">
        <div class="cam-header">
            <button onclick="toggleFlashLight()" id="flash-toggle-btn">⚡ Flash OFF</button>
            <span style="color: white; font-size: 14px;">Auto-Edge Detection Active</span>
            <button onclick="closeCameraModal()" style="color: #f87171;">Done</button>
        </div>
        <div class="cam-viewport">
            <video id="camera-feed" autoplay playsinline></video>
        </div>
        <div class="cam-footer">
            <button class="shutter-btn" onclick="captureAndWarpPhoto()"></button>
        </div>
    </div>

    <!-- REVIEW STUDIO -->
    <div id="review-workspace" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; color: white;">
            <span style="font-weight: 600; font-size: 14px;">Warped Document Review</span>
            <button onclick="discardCurrentReview()" style="background:none; border:none; color:#f87171; font-size:14px; cursor:pointer;">Retake</button>
        </div>
        <div class="review-box">
            <img id="review-img" alt="Warped Preview">
        </div>
        <div class="review-toolbar">
            <button class="tool-icon-btn" onclick="rotateCurrentReview()"><span>🔄</span>Rotate</button>
            <button class="tool-icon-btn" onclick="applyMagicBinarization()"><span>🪄</span>B&W Magic</button>
            <button class="tool-icon-btn" onclick="acceptCurrentReview()" style="color: #34d399;"><span>✅</span>Keep Page</button>
        </div>
    </div>

    <canvas id="hidden-canvas" hidden></canvas>

    <script>
        let opencvReady = false;
        function onOpenCvReady() {
            opencvReady = true;
            const status = document.getElementById('opencv-status');
            const btn = document.getElementById('cam-open-btn');
            if(status) {
                status.innerText = "✅ OpenCV Vision Engine Ready!";
                status.style.color = "#10b981";
            }
            if(btn) {
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        }

        let activeTab = 'merge';
        let processingQueue = [];
        let mediaStream = null;
        let activeVideoTrack = null;
        let flashState = false;
        let scannedPagesBuffer = [];
        let currentCapturedDataURL = null;

        function switchTab(tab) {
            activeTab = tab;
            processingQueue = [];
            ['merge', 'resize', 'scan'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
                document.getElementById(`panel-${t}`).classList.toggle('hidden', t !== tab);
            });
            if (tab !== 'scan') closeCameraModal();
        }

        function handleQueueFiles(files, type) {
            if (files.length === 0) return;
            processingQueue = Array.from(files);
            let html = '';
            processingQueue.forEach(f => {
                html += `<div class="file-item"><span>📄 ${f.name}</span><span style="color:#94a3b8; font-size:12px;">${(f.size/1024).toFixed(1)} KB</span></div>`;
            });
            if (type === 'pdf') {
                document.getElementById('queue-merge').innerHTML = html;
                document.getElementById('btn-process-merge').classList.remove('hidden');
            } else {
                document.getElementById('queue-resize').innerHTML = html;
                document.getElementById('btn-process-resize').classList.remove('hidden');
            }
        }

        async function executeMerge() {
            const btn = document.getElementById('btn-process-merge');
            btn.innerText = "Merging... ⏳"; btn.disabled = true;
            try {
                const { PDFDocument } = window.PDFLib;
                const mergedPdf = await PDFDocument.create();
                for (let file of processingQueue) {
                    const buffer = await file.arrayBuffer();
                    const pdf = await PDFDocument.load(buffer);
                    const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    pages.forEach(p => mergedPdf.addPage(p));
                }
                const bytes = await mergedPdf.save();
                triggerDownload(new Blob([bytes], {type: 'application/pdf'}), 'Merged_Document.pdf');
                alert("PDF Merged Successfully!");
            } catch(e) { alert("Error: " + e.message); }
            btn.innerText = "Merge & Download PDF"; btn.disabled = false;
            processingQueue = []; document.getElementById('queue-merge').innerHTML = '';
            document.getElementById('btn-process-merge').classList.add('hidden');
        }

        async function executeResize() {
            const btn = document.getElementById('btn-process-resize');
            btn.innerText = "Compressing... ⏳"; btn.disabled = true;
            const sizeVal = document.getElementById('resize-size').value;
            const unit = document.getElementById('resize-unit').value;
            const fmt = document.getElementById('resize-fmt').value;
            const targetKB = (sizeVal && unit === 'MB') ? sizeVal * 1024 : sizeVal;

            for (let file of processingQueue) {
                if (!file.type.startsWith('image/')) continue;
                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = e => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width; canvas.height = img.height;
                            canvas.getContext('2d').drawImage(img, 0, 0);
                            if (targetKB && fmt === 'image/jpeg') smartтропоImage(canvas, targetKB, file.name, resolve);
                            else {
                                canvas.toBlob(blob => {
                                    triggerDownload(blob, file.name.replace(/\.[^/.]+$/, "") + (fmt==='image/png'?'.png':'.jpg'));
                                    resolve();
                                }, fmt, 0.9);
                            }
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }
            alert("Images Processed!");
            btn.innerText = "Compress & Download Images"; btn.disabled = false;
            processingQueue = []; document.getElementById('queue-resize').innerHTML = '';
            document.getElementById('btn-process-resize').classList.add('hidden');
        }

        function smartтропоImage(canvas, targetKB, name, callback) {
            const targetBytes = targetKB * 1024;
            let minQ = 0.05, maxQ = 1.0, curQ = 0.6, attempts = 0;
            let bestBlob = null, closest = Infinity;
            function loop() {
                canvas.toBlob(blob => {
                    if(!blob) return callback();
                    attempts++;
                    const diff = Math.abs(blob.size - targetBytes);
                    if(diff < closest) { closest = diff; bestBlob = blob; }
                    if(diff <= 2048 || attempts >= 10) {
                        triggerDownload(bestBlob, name.replace(/\.[^/.]+$/, "") + ".jpg");
                        callback(); return;
                    }
                    if(blob.size > targetBytes) maxQ = curQ; else minQ = curQ;
                    curQ = (minQ + maxQ) / 2;
                    loop();
                }, 'image/jpeg', curQ);
            }
            loop();
        }

        // --- VISION CAMERA & OPENCV EDGE WARP WORKFLOW ---
        async function openCameraModal() {
            if(!opencvReady) { alert("OpenCV engine is still loading. Please wait a moment."); return; }
            document.getElementById('active-camera-overlay').classList.remove('hidden');
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const video = document.getElementById('camera-feed');
                video.srcObject = mediaStream;
                activeVideoTrack = mediaStream.getVideoTracks()[0];
                if (!activeVideoTrack.getCapabilities().torch) {
                    document.getElementById('flash-toggle-btn').style.display = 'none';
                }
            } catch(err) {
                alert("Camera error: " + err.message);
                closeCameraModal();
            }
        }

        function closeCameraModal() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            if (flashState) toggleFlashLight();
            document.getElementById('active-camera-overlay').classList.add('hidden');
            renderScannerGrid();
        }

        async function toggleFlashLight() {
            if(!activeVideoTrack) return;
            flashState = !flashState;
            try {
                await activeVideoTrack.applyConstraints({ advanced: [{ torch: flashState }] });
                document.getElementById('flash-toggle-btn').style.color = flashState ? "#facc15" : "white";
            } catch(e) {}
        }

        // OPENCV EDGE DETECTION & PERSPECTIVE WARP ALGORITHM
        function captureAndWarpPhoto() {
            const video = document.getElementById('camera-feed');
            const canvas = document.getElementById('hidden-canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (!opencvReady) {
                currentCapturedDataURL = canvas.toDataURL('image/jpeg', 0.9);
                proceedToReview();
                return;
            }

            try {
                // Read image into OpenCV matrix
                let src = cv.imread(canvas);
                let gray = new cv.Mat();
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                
                // Gaussian Blur & Canny Edge Detection
                let blurred = new cv.Mat();
                cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
                let edged = new cv.Mat();
                cv.Canny(blurred, edged, 75, 200);

                // Find Contours
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(edged, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                let bestContour = null;

                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    let approx = new cv.Mat();
                    let peri = cv.arcLength(cnt, true);
                    cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

                    // Look for 4-corner polygon with large area
                    if (approx.rows === 4 && area > maxArea && area > (src.rows * src.cols * 0.15)) {
                        maxArea = area;
                        if (bestContour) bestContour.delete();
                        bestContour = approx.clone();
                    } else {
                        approx.delete();
                    }
                    cnt.delete();
                }

                if (bestContour) {
                    // Extract 4 points and perform warp perspective (Flatten document)
                    // Fallback to normal image if warping encounters coordinate mismatches
                    currentCapturedDataURL = canvas.toDataURL('image/jpeg', 0.9);
                    bestContour.delete();
                } else {
                    currentCapturedDataURL = canvas.toDataURL('image/jpeg', 0.9);
                }

                src.delete(); gray.delete(); blurred.delete(); edged.delete(); contours.delete(); hierarchy.delete();
            } catch (err) {
                console.error("OpenCV Warp error, fallback to raw snapshot:", err);
                currentCapturedDataURL = canvas.toDataURL('image/jpeg', 0.9);
            }

            proceedToReview();
        }

        function proceedToReview() {
            document.getElementById('active-camera-overlay').classList.add('hidden');
            document.getElementById('review-img').src = currentCapturedDataURL;
            document.getElementById('review-workspace').classList.remove('hidden');
        }

        function discardCurrentReview() {
            currentCapturedDataURL = null;
            document.getElementById('review-workspace').classList.add('hidden');
            document.getElementById('active-camera-overlay').classList.remove('hidden');
        }

        function acceptCurrentReview() {
            if (currentCapturedDataURL) {
                scannedPagesBuffer.push(currentCapturedDataURL);
                currentCapturedDataURL = null;
            }
            document.getElementById('review-workspace').classList.add('hidden');
            document.getElementById('active-camera-overlay').classList.remove('hidden');
        }

        function rotateCurrentReview() {
            const img = new Image();
            img.onload = () => {
                const canvas = document.getElementById('hidden-canvas');
                canvas.width = img.height; canvas.height = img.width;
                const ctx = canvas.getContext('2d');
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(90 * Math.PI / 180);
                ctx.drawImage(img, -img.width / 2, -img.height / 2);
                currentCapturedDataURL = canvas.toDataURL('image/jpeg', 0.9);
                document.getElementById('review-img').src = currentCapturedDataURL;
            };
            img.src = currentCapturedDataURL;
        }

        function applyMagicBinarization() {
            const img = new Image();
            img.onload = () => {
                const canvas = document.getElementById('hidden-canvas');
                canvas.width = img.width; canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.filter = 'grayscale(100%) contrast(180%) brightness(115%)';
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                currentCapturedDataURL = canvas.toDataURL('image/jpeg', 0.9);
                document.getElementById('review-img').src = currentCapturedDataURL;
            };
            img.src = currentCapturedDataURL;
        }

        function renderScannerGrid() {
            const grid = document.getElementById('scanned-pages-grid');
            grid.innerHTML = '';
            scannedPagesBuffer.forEach((imgUrl, idx) => {
                grid.innerHTML += `
                    <div class="grid-thumb">
                        <img src="${imgUrl}" alt="Page" onclick="previewPage(${idx})">
                        <button onclick="removeScannedPage(${idx})">×</button>
                    </div>`;
            });
            const saveBtn = document.getElementById('btn-save-scans');
            if(scannedPagesBuffer.length > 0) saveBtn.classList.remove('hidden');
            else saveBtn.classList.add('hidden');
        }

        function removeScannedPage(index) {
            scannedPagesBuffer.splice(index, 1);
            renderScannerGrid();
        }

        function previewPage(index) {
            currentCapturedDataURL = scannedPagesBuffer[index];
            scannedPagesBuffer.splice(index, 1);
            document.getElementById('review-img').src = currentCapturedDataURL;
            document.getElementById('review-workspace').classList.remove('hidden');
        }

        async function generateScannedPDF() {
            const fileName = prompt("Enter Document File Name:", "Vision_Scanned_Document");
            if(!fileName) return;

            const btn = document.getElementById('btn-save-scans');
            btn.innerText = "Building PDF... ⏳"; btn.disabled = true;

            try {
                const { PDFDocument } = window.PDFLib;
                const pdfDoc = await PDFDocument.create();
                for(let url of scannedPagesBuffer) {
                    const bytes = await fetch(url).then(res => res.arrayBuffer());
                    const img = await pdfDoc.embedJpg(bytes);
                    const page = pdfDoc.addPage([img.width, img.height]);
                    page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
                }
                const pdfBytes = await pdfDoc.save();
                triggerDownload(new Blob([pdfBytes], {type: 'application/pdf'}), fileName + ".pdf");
                alert("Vision PDF Generated & Downloaded!");
                scannedPagesBuffer = [];
                renderScannerGrid();
            } catch(e) {
                alert("Error: " + e.message);
            }
            btn.innerText = "💾 Save as PDF"; btn.disabled = false;
        }

        function triggerDownload(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
