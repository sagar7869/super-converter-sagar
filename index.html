<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Converter Pro - HD Studio</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0f172a; margin: 0; padding: 15px; text-align: center; color: #f8fafc; padding-bottom: 120px; }
        
        h1 { font-size: 20px; margin-bottom: 2px; color: #f8fafc; }
        p.subtitle { font-size: 12px; color: #94a3b8; margin-top: 0; margin-bottom: 15px; }

        .tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 15px; }
        .tool-card { background: #1e293b; border: 1.5px solid #334155; padding: 10px 4px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; color: #94a3b8; }
        .tool-card.active { border-color: #6366f1; background: #312e81; color: #818cf8; }

        .panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
        
        .drop-zone { border: 2px dashed #475569; border-radius: 10px; padding: 25px 15px; cursor: pointer; background: #0f172a; }
        .options-panel { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; text-align: left; }
        .options-panel label { font-size: 11px; font-weight: 600; color: #cbd5e1; }
        .options-panel input, .options-panel select { width: 100%; padding: 8px; border: 1px solid #475569; background: #0f172a; color: white; border-radius: 6px; font-size: 13px; }
        
        .primary-btn { background: #6366f1; color: white; border: none; padding: 14px; font-size: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 4px 6px rgba(99, 102, 241, 0.4); }
        .primary-btn:active { transform: scale(0.98); }
        .success-btn { background: #10b981; }

        .file-item { background: #0f172a; padding: 8px 12px; border: 1px solid #334155; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }

        .native-cam-box { padding: 20px 10px; background: #0f172a; border-radius: 10px; border: 1px dashed #475569; margin-bottom: 15px; cursor: pointer; }

        /* FIXED FLOATING SAVE BUTTON ON DASHBOARD */
        .floating-save-container { position: fixed; bottom: 15px; left: 15px; right: 15px; background: rgba(15, 23, 42, 0.95); padding: 10px; border-radius: 10px; box-shadow: 0 -4px 15px rgba(0,0,0,0.8); z-index: 9999; backdrop-filter: blur(5px); }

        /* REVIEW STUDIO - FIXED LAYOUT SO NO BUTTONS ARE HIDDEN */
        #review-workspace { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f172a; z-index: 110; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; overflow-y: auto; }
        .review-header { display: flex; justify-content: space-between; align-items: center; color: white; flex-shrink: 0; padding: 5px; }
        
        .review-box { flex-grow: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; margin: 2px 0; }
        #review-canvas { max-width: 100%; max-height: 45vh; border-radius: 6px; border: 2px solid #6366f1; object-fit: contain; cursor: crosshair; touch-action: none; }
        
        /* STICKY TOOLBAR AT BOTTOM OF REVIEW SCREEN */
        .review-toolbar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; background: #1e293b; padding: 10px; border-radius: 10px; flex-shrink: 0; margin-bottom: 10px; }
        .tool-icon-btn { background: #334155; border: none; color: #f8fafc; padding: 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .tool-icon-btn span { font-size: 16px; }
        .tool-icon-btn.success { background: #10b981; color: white; grid-column: span 2; }

        .scanned-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; margin-bottom: 80px; max-height: 280px; overflow-y: auto; padding: 2px; }
        .grid-thumb { position: relative; background: #0f172a; border-radius: 8px; overflow: hidden; aspect-ratio: 3/4; border: 1px solid #334155; cursor: pointer; }
        .grid-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .grid-thumb button { position: absolute; top: 4px; right: 4px; background: rgba(239, 68, 68, 0.9); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 5; }
    </style>
</head>
<body>

    <h1>Super Converter Pro</h1>
    <p class="subtitle">HD Document Studio</p>

    <div class="tool-grid">
        <button class="tool-card active" id="tab-merge" onclick="switchTab('merge')">Merge PDF</button>
        <button class="tool-card" id="tab-resize" onclick="switchTab('resize')">Image Resizer</button>
        <button class="tool-card" id="tab-scan" onclick="switchTab('scan')">Smart Scan</button>
    </div>

    <!-- MERGE PANEL -->
    <div id="panel-merge" class="panel">
        <div class="drop-zone" onclick="document.getElementById('file-input-merge').click()">
            <p style="color:#94a3b8; font-size: 13px; margin:0;">📂 Tap to select PDF files</p>
            <input type="file" id="file-input-merge" accept="application/pdf" multiple hidden onchange="handleQueueFiles(this.files, 'pdf')">
        </div>
        <div id="queue-merge" style="margin-top: 12px;"></div>
        <button id="btn-process-merge" class="primary-btn hidden" style="margin-top: 12px;" onclick="executeMerge()">Merge & Download PDF</button>
    </div>

    <!-- RESIZE PANEL -->
    <div id="panel-resize" class="panel hidden">
        <div class="options-panel">
            <label>Target Size Constraint:</label>
            <div style="display: flex; gap: 6px;">
                <input type="number" id="resize-size" placeholder="e.g. 150">
                <select id="resize-unit"><option value="KB">KB</option><option value="MB">MB</option></select>
            </div>
            <label>Export Format:</label>
            <select id="resize-fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select>
        </div>
        <div class="drop-zone" onclick="document.getElementById('file-input-resize').click()">
            <p style="color:#94a3b8; font-size: 13px; margin:0;">🖼️ Tap to select Images</p>
            <input type="file" id="file-input-resize" accept="image/*" multiple hidden onchange="handleQueueFiles(this.files, 'image')">
        </div>
        <div id="queue-resize" style="margin-top: 12px;"></div>
        <button id="btn-process-resize" class="primary-btn hidden" style="margin-top: 12px;" onclick="executeResize()">Compress & Download Images</button>
    </div>

    <!-- SCANNER DASHBOARD -->
    <div id="panel-scan" class="panel hidden">
        <div id="scanner-dashboard">
            <div class="native-cam-box" onclick="document.getElementById('native-cam-input').click()">
                <p style="font-size: 15px; font-weight: bold; color: #818cf8; margin: 0 0 4px 0;">📸 Open Full HD Phone Camera</p>
                <p style="font-size: 11px; color: #94a3b8; margin: 0;">Click clear HD picture of your document</p>
                <input type="file" id="native-cam-input" accept="image/*" capture="environment" hidden onchange="handleNativeCapture(this.files)">
            </div>
            
            <p style="font-size: 12px; color: #94a3b8; margin: 5px 0 0 0;">Scanned Pages (Tap thumbnail to re-edit):</p>
            <div id="scanned-pages-grid" class="scanned-grid"></div>
        </div>
    </div>

    <!-- FIXED FLOATING SAVE BUTTON -->
    <div id="save-container" class="floating-save-container hidden">
        <button id="btn-save-scans" class="primary-btn success-btn" onclick="generateScannedPDF()">💾 Save as PDF</button>
    </div>

    <!-- REVIEW & EDIT STUDIO -->
    <div id="review-workspace" class="hidden">
        <div class="review-header">
            <span style="font-weight: bold; font-size: 14px;">HD Document Studio</span>
            <button onclick="discardCurrentReview()" style="background:none; border:none; color:#f87171; font-size:14px; cursor:pointer; font-weight:bold;">Discard</button>
        </div>
        
        <div class="review-box">
            <canvas id="review-canvas"></canvas>
        </div>
        <p style="font-size: 11px; color: #818cf8; margin: 2px 0; font-weight: bold;">👉 Drag white circles on canvas to crop document</p>
        
        <div class="review-toolbar">
            <button class="tool-icon-btn" onclick="rotateCanvasImage()"><span>🔄</span> Rotate 90°</button>
            <button class="tool-icon-btn" id="filter-btn" onclick="toggleMagicFilter()"><span>🪄</span> B&W Magic</button>
            <button class="tool-icon-btn success" onclick="acceptEditedPage()"><span>✅</span> Keep Page</button>
        </div>
    </div>

    <canvas id="hidden-canvas" hidden></canvas>

    <script>
        let activeTab = 'merge';
        let processingQueue = [];
        let scannedPagesBuffer = [];
        
        let workingImageObj = null;
        let originalImageDataBackup = null;
        let currentRotation = 0;
        let isFilterActive = false;
        let editingIndex = -1;

        // Interactive Crop State with 4 Independent Corners
        let corners = [];
        let activeCornerIndex = null;

        function switchTab(tab) {
            activeTab = tab;
            processingQueue = [];
            ['merge', 'resize', 'scan'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
                document.getElementById(`panel-${t}`).classList.toggle('hidden', t !== tab);
            });
            const saveContainer = document.getElementById('save-container');
            if (tab === 'scan' && scannedPagesBuffer.length > 0) {
                saveContainer.classList.remove('hidden');
            } else {
                saveContainer.classList.add('hidden');
            }
        }

        function handleQueueFiles(files, type) {
            if (files.length === 0) return;
            processingQueue = Array.from(files);
            let html = '';
            processingQueue.forEach(f => {
                html += `<div class="file-item"><span>📄 ${f.name}</span><span style="color:#94a3b8; font-size:11px;">${(f.size/1024).toFixed(1)} KB</span></div>`;
            });
            if (type === 'pdf') {
                document.getElementById('queue-merge').innerHTML = html;
                document.getElementById('btn-process-merge').classList.remove('hidden');
            } else {
                document.getElementById('queue-resize').innerHTML = html;
                document.getElementById('btn-process-resize').classList.remove('hidden');
            }
        }

        async function executeMerge() {
            const btn = document.getElementById('btn-process-merge');
            btn.innerText = "Merging... ⏳"; btn.disabled = true;
            try {
                const { PDFDocument } = window.PDFLib;
                const mergedPdf = await PDFDocument.create();
                for (let file of processingQueue) {
                    const buffer = await file.arrayBuffer();
                    const pdf = await PDFDocument.load(buffer);
                    const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    pages.forEach(p => mergedPdf.addPage(p));
                }
                const bytes = await mergedPdf.save();
                triggerDownload(new Blob([bytes], {type: 'application/pdf'}), 'Merged_Document.pdf');
                alert("PDF Merged Successfully!");
            } catch(e) { alert("Error: " + e.message); }
            btn.innerText = "Merge & Download PDF"; btn.disabled = false;
            processingQueue = []; document.getElementById('queue-merge').innerHTML = '';
            document.getElementById('btn-process-merge').classList.add('hidden');
        }

        async function executeResize() {
            const btn = document.getElementById('btn-process-resize');
            btn.innerText = "Compressing... ⏳"; btn.disabled = true;
            const sizeVal = document.getElementById('resize-size').value;
            const unit = document.getElementById('resize-unit').value;
            const fmt = document.getElementById('resize-fmt').value;
            const targetKB = (sizeVal && unit === 'MB') ? sizeVal * 1024 : sizeVal;

            for (let file of processingQueue) {
                if (!file.type.startsWith('image/')) continue;
                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = e => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width; canvas.height = img.height;
                            canvas.getContext('2d').drawImage(img, 0, 0);
                            if (targetKB && fmt === 'image/jpeg') smartтропоImage(canvas, targetKB, file.name, resolve);
                            else {
                                canvas.toBlob(blob => {
                                    triggerDownload(blob, file.name.replace(/\.[^/.]+$/, "") + (fmt==='image/png'?'.png':'.jpg'));
                                    resolve();
                                }, fmt, 0.9);
                            }
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }
            alert("Images Processed!");
            btn.innerText = "Compress & Download Images"; btn.disabled = false;
            processingQueue = []; document.getElementById('queue-resize').innerHTML = '';
            document.getElementById('btn-process-resize').classList.add('hidden');
        }

        function smartтропоImage(canvas, targetKB, name, callback) {
            const targetBytes = targetKB * 1024;
            let minQ = 0.05, maxQ = 1.0, curQ = 0.6, attempts = 0;
            let bestBlob = null, closest = Infinity;
            function loop() {
                canvas.toBlob(blob => {
                    if(!blob) return callback();
                    attempts++;
                    const diff = Math.abs(blob.size - targetBytes);
                    if(diff < closest) { closest = diff; bestBlob = blob; }
                    if(diff <= 2048 || attempts >= 10) {
                        triggerDownload(bestBlob, name.replace(/\.[^/.]+$/, "") + ".jpg");
                        callback(); return;
                    }
                    if(blob.size > targetBytes) maxQ = curQ; else minQ = curQ;
                    curQ = (minQ + maxQ) / 2;
                    loop();
                }, 'image/jpeg', curQ);
            }
            loop();
        }

        // --- NATIVE HD CAMERA WORKFLOW ---
        function handleNativeCapture(files) {
            if (files.length === 0) return;
            const file = files[0];
            const reader = new FileReader();
            reader.onload = e => {
                workingImageObj = new Image();
                workingImageObj.onload = () => {
                    currentRotation = 0;
                    isFilterActive = false;
                    editingIndex = -1;
                    document.getElementById('native-cam-input').value = '';
                    document.getElementById('review-workspace').classList.remove('hidden');
                    initCanvasAndCrop();
                };
                workingImageObj.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function initCanvasAndCrop() {
            const canvas = document.getElementById('review-canvas');
            const ctx = canvas.getContext('2d');
            
            let w = workingImageObj.width;
            let h = workingImageObj.height;
            
            if (currentRotation === 90 || currentRotation === 270) {
                canvas.width = h; canvas.height = w;
            } else {
                canvas.width = w; canvas.height = h;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate((currentRotation * Math.PI) / 180);
            ctx.drawImage(workingImageObj, -w / 2, -h / 2);
            ctx.restore();

            originalImageDataBackup = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // Initialize 4 corners inside image (TL, TR, BR, BL) with ample padding
            let padW = canvas.width * 0.1;
            let padH = canvas.height * 0.1;
            corners = [
                {x: padW, y: padH},                   // 0: Top-Left
                {x: canvas.width - padW, y: padH},    // 1: Top-Right
                {x: canvas.width - padW, y: canvas.height - padH}, // 2: Bottom-Right
                {x: padW, y: canvas.height - padH}    // 3: Bottom-Left
            ];

            if (isFilterActive) {
                applyFilterPixels(ctx, canvas.width, canvas.height);
            }
            drawCropOverlay();
        }

        function drawCropOverlay() {
            const canvas = document.getElementById('review-canvas');
            const ctx = canvas.getContext('2d');
            
            // Redraw base image
            ctx.putImageData(originalImageDataBackup, 0, 0);
            if (isFilterActive) {
                applyFilterPixels(ctx, canvas.width, canvas.height);
            }

            // Draw Darkened Outer Mask
            ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Highlight Inner Crop Polygon Area
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(corners[0].x, corners[0].y);
            for(let i=1; i<4; i++) ctx.lineTo(corners[i].x, corners[i].y);
            ctx.closePath();
            ctx.clip();
            ctx.putImageData(originalImageDataBackup, 0, 0);
            if (isFilterActive) {
                applyFilterPixels(ctx, canvas.width, canvas.height);
            }
            ctx.restore();

            // Draw Connecting Border Lines
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(corners[0].x, corners[0].y);
            for(let i=1; i<4; i++) ctx.lineTo(corners[i].x, corners[i].y);
            ctx.closePath();
            ctx.stroke();

            // Draw Big Touch-Friendly Corner Handles (White circles with blue stroke)
            const handleRadius = 24; // Large touch radius for finger dragging
            corners.forEach((c, idx) => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, handleRadius, 0, Math.PI * 2);
                ctx.fillStyle = (activeCornerIndex === idx) ? '#4f46e5' : '#ffffff';
                ctx.fill();
                ctx.strokeStyle = '#312e81';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Inner dot
                ctx.beginPath();
                ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = (activeCornerIndex === idx) ? '#ffffff' : '#4f46e5';
                ctx.fill();
            });
        }

        // --- SMOOTH TOUCH & DRAG FOR 4 CORNERS ---
        const canvas = document.getElementById('review-canvas');

        function getTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('mousedown', startTouchCorner);
        canvas.addEventListener('touchstart', startTouchCorner);

        function startTouchCorner(e) {
            e.preventDefault();
            const pos = getTouchPos(e);
            let hitRadius = 45; // Generous hit test radius for mobile fingers
            
            activeCornerIndex = null;
            corners.forEach((c, idx) => {
                let dist = Math.hypot(pos.x - c.x, pos.y - c.y);
                if (dist < hitRadius) {
                    activeCornerIndex = idx;
                }
            });

            // If no specific corner hit, find the nearest corner and select it
            if (activeCornerIndex === null) {
                let minDist = Infinity;
                corners.forEach((c, idx) => {
                    let dist = Math.hypot(pos.x - c.x, pos.y - c.y);
                    if (dist < minDist) {
                        minDist = dist;
                        activeCornerIndex = idx;
                    }
                });
            }

            window.addEventListener('mousemove', dragCorner);
            window.addEventListener('touchmove', dragCorner);
            window.addEventListener('mouseup', endTouchCorner);
            window.addEventListener('touchend', endTouchCorner);
        }

        function dragCorner(e) {
            if (activeCornerIndex === null) return;
            e.preventDefault();
            const pos = getTouchPos(e);

            // Keep within canvas bounds
            corners[activeCornerIndex].x = Math.max(0, Math.min(pos.x, canvas.width));
            corners[activeCornerIndex].y = Math.max(0, Math.min(pos.y, canvas.height));

            drawCropOverlay();
        }

        function endTouchCorner() {
            activeCornerIndex = null;
            drawCropOverlay();
            window.removeEventListener('mousemove', dragCorner);
            window.removeEventListener('touchmove', dragCorner);
            window.removeEventListener('mouseup', endTouchCorner);
            window.removeEventListener('touchend', endTouchCorner);
        }

        function rotateCanvasImage() {
            currentRotation = (currentRotation + 90) % 360;
            initCanvasAndCrop();
        }

        function toggleMagicFilter() {
            isFilterActive = !isFilterActive;
            const btn = document.getElementById('filter-btn');
            if (isFilterActive) btn.style.background = "#4f46e5";
            else btn.style.background = "#334155";
            drawCropOverlay();
        }

        function applyFilterPixels(ctx, width, height) {
            let imgData = ctx.getImageData(0, 0, width, height);
            let d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                let avg = (d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11);
                let val = avg > 130 ? 255 : avg * 0.45;
                d[i] = val; d[i + 1] = val; d[i + 2] = val;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function discardCurrentReview() {
            workingImageObj = null;
            document.getElementById('review-workspace').classList.add('hidden');
        }

        function acceptEditedPage() {
            const canvas = document.getElementById('review-canvas');
            const ctx = canvas.getContext('2d');
            
            // Bounding box of the 4 corners for precise cropped extraction
            let minX = Math.min(...corners.map(c => c.x));
            let maxX = Math.max(...corners.map(c => c.x));
            let minY = Math.min(...corners.map(c => c.y));
            let maxY = Math.max(...corners.map(c => c.y));

            let cropW = Math.max(50, maxX - minX);
            let cropH = Math.max(50, maxY - minY);

            const imgData = ctx.getImageData(Math.max(0, minX), Math.max(0, minY), cropW, cropH);
            const tempCanvas = document.getElementById('hidden-canvas');
            tempCanvas.width = cropW;
            tempCanvas.height = cropH;
            tempCanvas.getContext('2d').putImageData(imgData, 0, 0);
            
            const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.95);
            
            if (editingIndex >= 0) {
                scannedPagesBuffer[editingIndex] = dataUrl;
            } else {
                scannedPagesBuffer.push(dataUrl);
            }
            
            workingImageObj = null;
            editingIndex = -1;
            document.getElementById('review-workspace').classList.add('hidden');
            renderScannerGrid();
        }

        function editPage(index) {
            editingIndex = index;
            const imgUrl = scannedPagesBuffer[index];
            workingImageObj = new Image();
            workingImageObj.onload = () => {
                currentRotation = 0;
                isFilterActive = false;
                document.getElementById('review-workspace').classList.remove('hidden');
                initCanvasAndCrop();
            };
            workingImageObj.src = imgUrl;
        }

        function renderScannerGrid() {
            const grid = document.getElementById('scanned-pages-grid');
            grid.innerHTML = '';
            scannedPagesBuffer.forEach((imgUrl, idx) => {
                grid.innerHTML += `
                    <div class="grid-thumb">
                        <img src="${imgUrl}" alt="Page" onclick="editPage(${idx})">
                        <button onclick="event.stopPropagation(); removeScannedPage(${idx})">×</button>
                    </div>`;
            });
            
            const saveContainer = document.getElementById('save-container');
            if(activeTab === 'scan' && scannedPagesBuffer.length > 0) {
                saveContainer.classList.remove('hidden');
            } else {
                saveContainer.classList.add('hidden');
            }
        }

        function removeScannedPage(index) {
            scannedPagesBuffer.splice(index, 1);
            renderScannerGrid();
        }

        async function generateScannedPDF() {
            const fileName = prompt("Enter Document File Name:", "HD_Scanned_Document");
            if(!fileName) return;

            const saveBtn = document.getElementById('btn-save-scans');
            saveBtn.innerText = "Building PDF... ⏳"; saveBtn.disabled = true;

            try {
                const { PDFDocument } = window.PDFLib;
                const pdfDoc = await PDFDocument.create();
                for(let url of scannedPagesBuffer) {
                    const bytes = await fetch(url).then(res => res.arrayBuffer());
                    const img = await pdfDoc.embedJpg(bytes);
                    const page = pdfDoc.addPage([img.width, img.height]);
                    page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
                }
                const pdfBytes = await pdfDoc.save();
                triggerDownload(new Blob([pdfBytes], {type: 'application/pdf'}), fileName + ".pdf");
                alert("HD PDF Generated & Downloaded!");
                scannedPagesBuffer = [];
                renderScannerGrid();
            } catch(e) {
                alert("Error: " + e.message);
            }
            saveBtn.innerText = "💾 Save as PDF"; saveBtn.disabled = false;
        }

        function triggerDownload(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
