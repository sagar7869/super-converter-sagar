<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Converter Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
    <header>
        <h1>Super Converter Pro</h1>
        <p>100% Client-Side PDF & Image Toolkit</p>
    </header>

    <main>
        <div class="tool-grid">
            <button class="tool-card" id="btn-merge">Merge PDF</button>
            <button class="tool-card" id="btn-resize">Image Resizer</button>
            <button class="tool-card" id="btn-scan">Smart Scanner</button>
        </div>

                <div id="resize-options" class="resize-options hidden">
            <input type="number" id="input-width" placeholder="Width (px)">
            <input type="number" id="input-height" placeholder="Height (px)">
            
            <!-- SIZE AUR UNIT SELECTOR EK SATH -->
            <div style="display: flex; gap: 5px; width: 100%;">
                <input type="number" id="input-size" placeholder="Target Size" style="width: 60%;">
                <select id="input-unit" style="width: 40%;">
                    <option value="KB">KB</option>
                    <option value="MB">MB</option>
                </select>
            </div>

            <select id="input-format">
                <option value="image/jpeg">Export as JPG</option>
                <option value="image/png">Export as PNG</option>
            </select>
        </div>


        <div id="drop-zone" class="drop-zone">
            <p>Drag & Drop files here or <span style="color: #4F46E5; cursor: pointer;">Browse</span></p>
            <input type="file" id="file-input" multiple hidden>
        </div>
        
        <div id="workspace"></div>

        <!-- NAYA PROFESSIONAL STAGING AREA -->
        <div id="file-list-container" class="file-list-container hidden">
            <div id="file-list" class="file-list"></div>
            <button id="btn-action" class="primary-btn">Process Files</button>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
